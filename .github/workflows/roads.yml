name: roads-packs

# Build the SVS highways database (OSM motorway/trunk via Geofabrik,
# flags/ref carried per AER-623/RD3, pyEfis PR #165) and upload it as a
# signed `highways` sqlite pack. See docs/roads.md for the full recipe;
# this is that recipe wired to CI so a run needs no local secrets or
# workstation -- only the MINISIGN_SECRET_KEY / R2_* Actions secrets
# already used by cyclical.yml.
#
# Full CONUS is a multi-state Geofabrik download (docs/roads.md: "minutes"
# once fetched, but the fetch itself is the expensive part) -- expect a
# long-running job for `--states conus`. A partial state list is a cheap
# way to test the workflow itself -- but leave `publish` off for that, since
# `--upload` always targets the production `highways-conus` id regardless of
# `states`: a states-limited pack still gets uploaded and manifest-listed
# under the real id (makerplane-data#60, 2026-09-12 incident: a Colorado-only
# "2026q3r1-smoketest" build stayed selected as the live CONUS pack --
# `Manifest.select` now ranks any hyphen-suffixed test cycle below the
# canonical one it stood in for, AER-1109, but a states-limited pack under
# the production id is still wrong data to have live). `packtool
# remove-pack` retracts a bad entry like that one.
#
# Publish gate (TV3, AER-4101): build-pack --upload writes the pack's
# pack-report/1 test record before the manifest is signed. A pack whose
# blocking checks fail, or that warns with no build note, is not published;
# its record goes to reports/rejected/. A published (id, cycle) is
# immutable: a rebuild needs a new cycle tag. Build notes come only from the
# person dispatching (`notes`), for this edition.
on:
  workflow_dispatch:
    inputs:
      states:
        description: "Geofabrik states ('conus', or a comma list like 'colorado,texas')"
        default: "conus"
      cycle:
        description: "Edition tag (a published cycle cannot be republished: use a new tag, e.g. r2)"
        default: "2026q3r1"
      publish:
        description: "Upload to production and re-sign the live manifest -- leave OFF for a states test-run"
        type: boolean
        default: true
      notes:
        description: "Build notes for checks that warn, written for this edition: JSON, e.g. {\"ROW-002\": \"why\"}"
        default: ""

env:
  PYEFIS_REPO: ${{ vars.PYEFIS_REPO || 'billmallard/pyEfis' }}
  PYEFIS_REF:  ${{ vars.PYEFIS_REF  || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency: roads-packs        # never two builds racing the manifest
    outputs:
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PYEFIS_REPO }}
          ref: ${{ env.PYEFIS_REF }}
          path: pyefis-src
      - run: pip install -e .[build] pyshp numpy

      - name: Fetch + build highways.sqlite (packtool build-roads)
        id: build
        env:
          PYEFIS_TOOLS_DIR: ${{ github.workspace }}/pyefis-src/tools
        run: |
          packtool build-roads --states "${{ inputs.states }}" --dest highways.sqlite

      - name: Pack + gate + upload (signed)
        id: publish
        if: ${{ inputs.publish }}
        env:
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MINISIGN_SECRET_KEY:  ${{ secrets.MINISIGN_SECRET_KEY }}
          PYEFIS_SRC_DIR:       ${{ github.workspace }}/pyefis-src/src
          NOTES:                ${{ inputs.notes }}
        run: |
          notes=()
          if [ -n "$NOTES" ]; then printf '%s' "$NOTES" > notes.json; notes=(--notes-file notes.json); fi
          packtool build-pack highways.sqlite "${notes[@]}" \
            --id highways-conus --kind highways --cycle "${{ inputs.cycle }}" \
            --attribution "OpenStreetMap contributors (ODbL)" \
            --license "ODbL-1.0" --license-url "https://opendatacommons.org/licenses/odbl/1-0/" \
            --regions conus --url-base https://navdata.aerocommons.org/packs \
            --upload --bucket makerplane-data

      # The pack this run published, as a sha256sum line, for the attest job.
      # Only after the gate accepted it and the manifest listing it is signed.
      - name: List published pack
        id: published
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          CYCLE: ${{ inputs.cycle }}
        run: |
          { echo 'published<<END_PUBLISHED'; (cd work/packs && sha256sum "highways-conus-$CYCLE.pack"); echo 'END_PUBLISHED'; } >> "$GITHUB_OUTPUT"

      # The public run page's record of what this run checked, rendered from
      # the test record the publish gate wrote (AER-4101). always(): a failed
      # or refused build still says what it checked and why it stopped.
      - name: Job summary
        if: ${{ always() }}
        env:
          STATES:  ${{ inputs.states }}
          CYCLE:   ${{ inputs.cycle }}
          PUBLISH: ${{ inputs.publish }}
          BUILD:   ${{ steps.build.outcome }}
          UPLOAD:  ${{ inputs.publish && steps.publish.outcome || 'off' }}
        run: |
          mkdir -p work/reports
          packtool job-summary --title "roads-packs: highways-conus $CYCLE" \
            --records work/reports \
            --file highways.sqlite --file "work/packs/highways-conus-$CYCLE.pack" \
            --input "states=$STATES" --input "cycle=$CYCLE" --input "publish=$PUBLISH" \
            --input "fetch + build=$BUILD" --input "gate + sign + upload=$UPLOAD"

  # Build provenance (TV10): a Sigstore-signed statement, kept in GitHub's
  # public attestation store, that this workflow at this commit built each
  # pack the build job published. It is a separate job so the OIDC token
  # that signs it is never in reach of the build steps, which run pyEfis
  # tools from another repo's dev branch. How to check one:
  # docs/provenance.md (`gh attestation verify`).
  attest:
    needs: build
    if: ${{ always() && needs.build.outputs.published != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Subjects (the packs the build job published)
        env:
          PUBLISHED: ${{ needs.build.outputs.published }}
        run: printf '%s\n' "$PUBLISHED" > published.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: published.sha256
