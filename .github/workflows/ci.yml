name: ci

# Tests + a no-secrets dry-run of the pipeline on every push / PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev,plates]
      # node runs the pack inspector's JS (site/assets/inspect-core.js), both
      # on its own and against the Python signer in tests/test_inspector.py.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The stock binary checks packtools.signing against the real minisign
      # wire format; its own tests would pass a drift that matched on both
      # sides (tests/test_minisign_interop.py). REQUIRE turns a missing
      # binary into a failure, not a skip.
      - name: Install stock minisign
        run: sudo apt-get update -q && sudo apt-get install -y -q minisign && minisign -v
      - name: SPDX license headers present
        run: python scripts/spdx_check.py
      - name: Stock minisign verifies a packtools signature
        env:
          MAKERPLANE_REQUIRE_MINISIGN: "1"
        run: python -m pytest -v tests/test_minisign_interop.py
      - name: Unit tests
        env:
          MAKERPLANE_REQUIRE_MINISIGN: "1"
        run: python -m pytest
      - name: Pack inspector JS tests
        run: node --test tests/inspector/*.test.mjs
      - name: Pipeline dry-run (no network, no secrets)
        run: python -m packtools.run_cyclical --dry-run --date 2026-06-14

  configurator-test:
    # Node-side tests for the editor (public/editor.html has no build step --
    # test/*.test.mjs extracts and runs its real functions, brace-matched out
    # of the source, same as tools/twin_proto.mjs's proto pages).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: configurator
      - run: npm test
        working-directory: configurator

  dco:
    # Every commit in a PR must carry a Signed-off-by line (Developer
    # Certificate of Origin -- see CONTRIBUTING.md). Push builds skip this.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on all PR commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          for c in $(git rev-list "$base..$head" --no-merges); do
            if ! git log -1 --format=%B "$c" | grep -qi '^Signed-off-by: .*<.*@.*>'; then
              echo "MISSING Signed-off-by: $(git log -1 --oneline "$c")"
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "DCO sign-off present on all commits"
          exit $bad
