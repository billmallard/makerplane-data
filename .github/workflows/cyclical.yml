name: cyclical-packs

# Build current+next NASR/DOF packs and regenerate the signed manifest.
# Idempotent (skip-if-present), so a daily run does nothing until the FAA
# publishes a new cycle.
#
# Publish gate (TV3, AER-4101): each built pack gets its pack-report/1 test
# record before the manifest is signed; a pack whose blocking checks fail,
# or that warns, is not published and its record goes to reports/rejected/.
# The scheduled run has no build notes, so a warn is refused rather than
# noted (AER-4102 C8). A person who has looked at the warn dispatches this
# workflow by hand with `notes`, each keyed to one edition.
on:
  schedule:
    # 09:20 UTC daily — after the FAA's typical posting window.
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Pack ids to run, space-separated (empty = all)"
        default: ""
      notes:
        description: "Build notes for checks that warned, written for that edition: JSON, e.g. {\"procedures-conus@2612:ROW-002\": \"why\"}"
        default: ""

# Interim tool sharing: the FAA->sqlite build scripts live in pyEfis. We
# check it out and point PYEFIS_TOOLS_DIR at its tools/ dir. Override these
# repo variables once a standalone pyefis-tools package exists.
env:
  PYEFIS_REPO: ${{ vars.PYEFIS_REPO || 'billmallard/pyEfis' }}
  PYEFIS_REF:  ${{ vars.PYEFIS_REF  || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency: cyclical-packs        # never two builds racing the manifest
    outputs:
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out pyEfis (for the build tools)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PYEFIS_REPO }}
          ref: ${{ env.PYEFIS_REF }}
          path: pyefis-src

      - run: pip install -e .[build]

      - name: Build cycles + sign + upload
        env:
          PYEFIS_TOOLS_DIR: ${{ github.workspace }}/pyefis-src/tools
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ vars.R2_BUCKET || 'makerplane-data' }}
          MINISIGN_SECRET_KEY:  ${{ secrets.MINISIGN_SECRET_KEY }}
          # Empty on the schedule: only a person's dispatch carries these.
          ONLY:                 ${{ inputs.only }}
          NOTES:                ${{ inputs.notes }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then read -ra ids <<< "$ONLY"; args+=(--only "${ids[@]}"); fi
          if [ -n "$NOTES" ]; then printf '%s' "$NOTES" > notes.json; args+=(--notes-file notes.json); fi
          python -m packtools.run_cyclical --published-checksums work/published.sha256 "${args[@]}"

      # The packs this run published, as sha256sum lines, for the attest job.
      # always(): a run that turned red on one source still published the
      # healthy ones, and those are attested.
      - name: List published packs
        id: published
        if: ${{ always() }}
        run: |
          f=work/published.sha256
          [ -s "$f" ] || exit 0
          { echo 'published<<END_PUBLISHED'; cat "$f"; echo 'END_PUBLISHED'; } >> "$GITHUB_OUTPUT"

  # Build provenance (TV10): a Sigstore-signed statement, kept in GitHub's
  # public attestation store, that this workflow at this commit built each
  # pack the build job published. It is a separate job so the OIDC token
  # that signs it is never in reach of the build steps, which run pyEfis
  # tools from another repo's dev branch. How to check one:
  # docs/provenance.md (`gh attestation verify`).
  attest:
    needs: build
    if: ${{ always() && needs.build.outputs.published != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Subjects (the packs the build job published)
        env:
          PUBLISHED: ${{ needs.build.outputs.published }}
        run: printf '%s\n' "$PUBLISHED" > published.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: published.sha256
