name: site

# Deploy site/ (index.html, data.yaml.sample, assets/) to the root of the
# makerplane-data bucket, served at https://navdata.aerocommons.org/.
# `packtool deploy-site` writes only files whose bytes differ from the live
# object and refuses any key the pack pipeline owns (manifest, signature,
# packs/). It replaces the manual `wrangler r2 object put`, which needed
# Bill's OAuth login (AER-4098).
#
#   push to main  -- a release that changes site/ deploys it, the same way a
#                    merge to main deploys the prod Worker
#                    (docs/release_process.md).
#   schedule      -- daily, two hours after the cyclical build: re-renders the
#                    test-report pages (reports/**.html, reports/index.json)
#                    from whatever records the publish paths have uploaded,
#                    so a new record gets its page without anyone deploying,
#                    and rewrites each record's unsigned status.json overlay
#                    (TV8: state, pack:<id> issues, Auspex addenda).
#   dispatch      -- an out-of-band deploy from the chosen branch, e.g. a fix
#                    merged to dev that should not wait for the next release.
#                    `dry_run` (default on) lists what would change and
#                    writes nothing.
on:
  push:
    branches: [main]
    paths: ["site/**", "packtools/reportsite.py", "packtools/community.py",
            "packtools/schemasite.py", "packtools/packmeta.py",
            "docs/schema_descriptions.yaml"]
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "list what would change; write nothing"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: site-deploy
    # issues: write creates a pack:<id> label for each id in the live
    # catalog; nothing else here writes to GitHub.
    permissions:
      contents: read
      issues: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[build]

      - name: Deploy site/ to the bucket root
        env:
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          packtool deploy-site --bucket makerplane-data \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      # The pages are rendered from the records in the bucket, never from
      # this checkout; a banned word or a leaked host in any page fails here
      # and nothing is written.
      - name: Render the test-report pages
        env:
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          packtool report-site --bucket makerplane-data \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      # The pack format pages (SCH1), rendered from the schema/<kind>.json
      # captures each publish path writes once its manifest is signed.
      # --bootstrap first captures any live pack id that has none, from the
      # published pack (never replacing a publish-path capture), so a kind
      # gets its page without waiting for its next build. Same lint gate as
      # the report pages.
      - name: Render the pack format pages
        env:
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          packtool schema-site --bucket makerplane-data --bootstrap \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      # Learned after publish, never written into the record (plan 4.5). The
      # catalog signature is checked against keys/minisign.pub first, and a
      # failed issues fetch fails the step rather than listing no issues.
      - name: Status overlay and pack labels
        env:
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN:         ${{ github.token }}
        run: |
          packtool status-overlay --bucket makerplane-data --repo "$GITHUB_REPOSITORY" \
            --ensure-labels ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      # The upload succeeding is not the proof; the public URL serving the
      # committed bytes is.
      - name: Verify the public site serves site/
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          fail=0
          cd site
          for f in $(find . -type f | sed 's|^\./||' | sort); do
            if curl -fsS "https://navdata.aerocommons.org/$f?run=$GITHUB_RUN_ID" | cmp -s - "$f"; then
              echo "ok    $f"
            else
              echo "DIFF  $f"; fail=1
            fi
          done
          if curl -fsS "https://navdata.aerocommons.org/reports/index.json?run=$GITHUB_RUN_ID" \
              | python -c "import json,sys; assert json.load(sys.stdin)['schema'] == 'report-index/1'"; then
            echo "ok    reports/index.json"
          else
            echo "BAD   reports/index.json"; fail=1
          fi
          # Every live kind has a format page, or is named as not captured yet.
          if curl -fsS "https://navdata.aerocommons.org/schema/index.json?run=$GITHUB_RUN_ID" \
              | python -c "
          import json, sys
          idx = json.load(sys.stdin)
          assert idx['schema'] == 'schema-index/1'
          for kind, k in sorted(idx['kinds'].items()):
              print(f'ok    {k[\"page\"]}  ({len(k[\"packs\"])} pack id(s))')
          for kind in idx['uncaptured']:
              print(f'NOTE  schema/{kind}: no capture yet')
          "; then :; else
            echo "BAD   schema/index.json"; fail=1
          fi
          # Every edition the index lists serves an overlay written today.
          if curl -fsS "https://navdata.aerocommons.org/reports/index.json?run=$GITHUB_RUN_ID" \
              | python -c "
          import datetime, json, sys, urllib.request
          idx = json.load(sys.stdin)['packs']
          for pid, cycles in sorted(idx.items()):
              for cyc in sorted(cycles):
                  url = f'https://navdata.aerocommons.org/reports/{pid}/{cyc}/status.json?run=$GITHUB_RUN_ID'
                  req = urllib.request.Request(url, headers={'User-Agent': 'makerplane-data-site-check'})
                  s = json.load(urllib.request.urlopen(req, timeout=30))
                  assert s['schema'] == 'pack-status/1' and s['as_of'] == datetime.date.today().isoformat(), url
                  print(f'ok    reports/{pid}/{cyc}/status.json  {s[\"state\"]}, {len(s[\"known_issues\"])} issue(s)')
          "; then :; else
            echo "BAD   status.json overlays"; fail=1
          fi
          exit $fail
