# SPDX-License-Identifier: CC-BY-4.0
# Golden facts: published values the GLD-001 check compares packs against.
#
# Every value here comes from the published source named on the same
# entry, never from one of our own packs. A fact
# that the pack does not match is shown on the pack's test record; it is a
# reason for a person to look, not proof that either side is wrong (a
# runway gets extended, a frequency changes). How to add one, and what each
# field means: docs/golden_facts.md. Pull requests welcome.
#
# Note that the FAA Chart Supplement and the NASR files the navdata and
# navaids packs are built from are both FAA products: a fact checks our
# build against the FAA's own publication, not the FAA against the world.

