# Region definitions for makerplane-data.
#
# Regions serve two purposes:
#   1. Terrain/chart packs are grouped by region so SD-card users can hold
#      just their flying area while NVMe users take a whole continent.
#      Tiles are assigned to a region by their SW corner (see regions.py).
#   2. The Pi's data.yaml lists "regions of interest"; the updater pulls the
#      packs whose `regions` overlap.
#
# bbox order is [lat_min, lon_min, lat_max, lon_max] (matches the manifest).
# Longitudes are negative in the western hemisphere. Overlap between regions
# is harmless: a tile present in two installed region packs is identical
# content, unioned into one tile tree on the Pi.

regions:
  # Navdata coverage region (FAA NASR/CIFP/DOF are CONUS-wide single packs).
  conus:
    name: Continental US
    bbox: [24, -125, 50, -66]

  # Terrain region groups (~8-15 GB each at GLO-30).
  us-west:
    name: US West
    bbox: [31, -125, 49, -102]
  us-central:
    name: US Central
    bbox: [25, -104, 49, -90]
  us-east:
    name: US East
    bbox: [24, -90, 49, -66]
  us-south:
    name: US South
    bbox: [24, -107, 37, -75]
  # lon_min -177 (not the old -170): AER-1990 measured that -170 cuts off
  # five real FAA airports with published d-TPP plates in the central
  # Aleutians / Bering Sea -- Adak (PADK), Atka (PAAK), Gambell (PAGM),
  # Savoonga (PASA), St. Paul Island (PASN), westmost at PADK's real
  # -176.643. -177 adds 41 real Copernicus GLO-30 tiles (346 MB raw source);
  # built and compressed the same way the pipeline ships, that's ~210 MB
  # added to the live terrain-alaska pack, a measured +4.4% growth
  # (docs/aer-1990-alaska-region-gap.md).
  #
  # Deliberately NOT widened all the way to the -180 dateline: at this
  # latitude band, -178 through -180 is mostly Chukotka Peninsula (Russia),
  # not Alaska -- widening that far adds 20 more tiles (~328 MB compressed,
  # +6.8%) for tiles that are foreign land, not US coverage. See the doc
  # above for the tile-by-tile breakdown.
  #
  # Eareckson Air Station (PASY, Shemya) has real d-TPP plates too but sits
  # at +174.1 E -- across the antimeridian, which this bbox shape (a single
  # lon_min/lon_max pair) cannot represent regardless of how far west it
  # is widened. Still an open gap; see the doc.
  alaska:
    name: Alaska
    bbox: [51, -177, 72, -129]
  canada-west:
    name: Canada West
    bbox: [48, -140, 72, -100]
  canada-east:
    name: Canada East
    bbox: [42, -100, 72, -52]
  mexico-central-america:
    name: Mexico & Central America
    bbox: [7, -118, 33, -77]
