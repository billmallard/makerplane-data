  .align-h { position: absolute; left: 0; right: 0; height: 1px; background: #e24bd0; }
  .inst { position: absolute; outline: 1px solid rgba(120,140,160,.4); }

  .inst-text {

  }
  .gauge { width: 100%; height: 100%; box-sizing: border-box; pointer-events: none; overflow: hidden; }
  .gauge-svg { width: 100%; height: 100%; display: block; }
  .svsimg { position: relative; width: 100%; height: 100%; overflow: hidden; background: #15639f; }

  .bargauge { display: flex; flex-direction: column; padding: 2px 3px; gap: 1px; }
  .bargauge .g-name, .bargauge .g-val { line-height: 1; white-space: nowrap; }
  /* Vertical: name/value centred over the bar (pyEfis VerticalBar AlignCenter). */
  .bargauge.vert { align-items: center; justify-content: flex-start; }
  /* Horizontal: name top-left, value bottom-left, bar full width (HorizontalBar AlignLeft). */
  .bargauge.horiz { align-items: stretch; justify-content: space-between; }
  .bargauge.horiz .g-name, .bargauge.horiz .g-val { text-align: left; }
  #props select.ref-orphan { border-color: #e0231f; color: #ff7b72; }

  .ref-offer p { margin: 0 0 6px; font-size: 12px; }
  /* Over the twin, not instead of the selection outline. */
  /* A border only: the twin inside keeps the device's colours. */
  .inst.orphan::after, .inst.migrating::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 2px solid #e0231f; }
  .inst.migrating::after { border: 2px dashed #58a6ff; }
  /* Below the box, so it never covers what the twin draws. */
  .inst-note { position: absolute; left: 0; top: 100%; margin-top: 2px; padding: 1px 4px; font: 11px/1.3 system-ui, sans-serif;
    color: #c9d1d9; background: #161b22; border: 1px solid #30363d; border-radius: 3px; white-space: nowrap;
    pointer-events: none; z-index: 60; }
  .bargauge .g-track { position: relative; border: 1px solid #30363d; border-radius: 2px; }
  .bargauge.vert .g-track { flex: 1; width: 32%; background: linear-gradient(to top, #e0231f 0 6%, #e8c21a 6% 18%, #22b03a 18% 82%, #e8c21a 82% 94%, #e0231f 94% 100%); }
  .bargauge.vert .g-mark { position: absolute; left: -18%; right: -18%; height: 2px; background: #fff; transform: translateY(50%); }
  .bargauge.horiz .g-track { width: 100%; height: 30%; background: linear-gradient(to right, #e0231f 0 6%, #e8c21a 6% 18%, #22b03a 18% 82%, #e8c21a 82% 94%, #e0231f 94% 100%); }
  .bargauge.horiz .g-mark { position: absolute; top: -18%; bottom: -18%; width: 2px; background: #fff; transform: translateX(-50%); }
  .tape { position: relative; box-sizing: border-box; background: rgba(18,22,28,.72); color: #e6edf3; }
  .tape .tk { position: absolute; right: 3px; transform: translateY(-50%); white-space: nowrap; line-height: 1; opacity: .85; }
  /* Readout panel -- twin of pyefis.instruments.helpers READOUT_* (P5c):
     rounded container over a translucent black fill, border in the foreground
     colour at .85. The radius/padding track the digit height, as they do in
     NumericalDisplay (panel 1.2x the digits). Radius is ONE shared token,
     helpers.READOUT_RADIUS_RATIO = .145 (AER-413, corrects AER-386/pyEfis#141's
     now-deleted TAPE_READOUT_RADIUS_RATIO), applied against the panel's OWN
     height -- not against fontSize (see .tasbox below, a different base) and
     not against font_height directly. NumericalDisplay's panel height is
     1.20 * font_height, so as a fraction of THIS box's own em (font_height,
     matching ro.style.fontSize below) that is .145 * 1.20 = .174em. This is
     the same corner, by proportion, as the HSI panel's -- reusing the HSI's
     own .35em here would over-round the tape box to a near-pill (the tape box
     is much shorter relative to its own font than the HSI panel is to its
     fontSize). Full derivation in helpers.READOUT_RADIUS_RATIO's docstring. */
  .tape .readout { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.85); border-radius: .174em; padding: .1em 0; text-align: center; font-weight: 600; line-height: 1.2; }
  .tape .vbands { position: absolute; left: 0; top: 0; bottom: 0; width: 9%; background: linear-gradient(to top, #22b03a 0 45%, #e8c21a 45% 72%, #e0231f 72% 88%, #fff 88% 100%); }
  /* Box placement follows the widget: Airspeed_Tape puts its NumericalDisplay
     in the right half (x = w/2, width w/2) with the notch pointing left at the
     scale; Altimeter_Tape puts its box at x = 0, width w/1.20, notch pointing
     right. The twin used to span nearly the full width and point both notches
     left. */
  .tape .readout.notch { left: 50%; right: 0; }
  .tape.alt .readout.notch { left: 0; right: 16.7%; }
  /* TAS box: the same panel, one deviation -- it sits ON the scrolling scale
     rather than beside it, so the fill is knocked back further (.85) or the
     tick labels read through the value. Matches the widget.
     Corner radius is NOT a fixed em here (unlike .readout above): pyEfis
     computes it as box_h * helpers.READOUT_RADIUS_RATIO (.145, AER-413)
     against the TAS box's OWN height, and that height isn't driven by a
     single font-size the way .readout's is -- it's the botPad-based slice of
     the tape height this twin already carves out below. So buildTape() sets
     border-radius inline from the box's actual pixel height (tasH) times the
     same .145, instead of guessing an em value against an unrelated basis.
     The old .35em here was a holdover from the HSI's own READOUT_RADIUS_RATIO,
     left underived pending this fix (flagged in AER-387, closed by AER-480). */
  .tape .tasbox { position: absolute; left: 2%; right: 2%; bottom: 2%; background: rgba(0,0,0,.85); border: 1px solid rgba(255,255,255,.85); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .tape .tasbox .lbl { font-size: .62em; font-weight: 700; }
  .tape .tasbox .val { font-weight: 600; }
  .htape { position: relative; box-sizing: border-box; overflow: hidden; background: rgba(18,22,28,.72); color: #e6edf3; }
  .htape .htk { position: absolute; top: 6%; transform: translateX(-50%); text-align: center; line-height: 1; white-space: nowrap; }
  .htape .htk .bar { display: block; width: 1px; height: 6px; margin: 0 auto 1px; background: currentColor; opacity: .55; }

  .trendtape { position: relative; box-sizing: border-box; overflow: hidden; background: rgba(18,22,28,.72); color: #e6edf3; }

  /* tab_section's nested twin (AER-345). A distinct class family from the
     screen-switcher's .screen-tab/.tabs (the latter predates this feature
     and isn't reused, AER-173 sec 1/sec 4c) so the two aren't visually
     conflated. */
  .tab-twin { position: absolute; inset: 0; }
  /* Position (top/left/width/height) and the bar-vs-content separator border
     are edge-dependent (tab_position, AER-665) and set inline per instance --
     see tabStripGeom()/tabContentGeom(). */
  .tab-twin-strip {
    position: absolute; display: flex; overflow: hidden; background: #161b22;
  }
  .tab-twin-chip {
    padding: 0 8px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #8b949e; white-space: nowrap; cursor: pointer;
    border-right: 1px solid #21262d;
  }
  .tab-twin-chip.active { color: #e6edf3; background: #0d1117; }
  /* left/right tab_position: QTabBar's RoundedWest/RoundedEast shapes stack
     tabs down the bar and rotate the labels (tab_section/__init__.py
     _TAB_BAR_SHAPE) -- vertical-rl approximates the rotated glyphs; a chip
     separates from its neighbour on the stacking axis, not the side one. */
  .tab-twin-chip.vertical {
    writing-mode: vertical-rl; padding: 8px 0;
    border-right: none; border-bottom: 1px solid #21262d;
  }
  .tab-twin-content { position: absolute; overflow: hidden; }
  /* Container-scoped drop zone (sec 4b): visible only while the container
     itself is selected, so it reads as "drop into the active tab here"
     rather than a permanent decoration. */
  .inst.sel > .tab-twin > .tab-twin-content {
    outline: 1px dashed rgba(46,160,67,.6); outline-offset: -1px;
  }
  .tab-twin-content.reject-flash { outline: 1px dashed rgba(224,35,31,.85); }

<script>
const $ = (id) => document.getElementById(id);
const ASSETS = "/assets/editor";
const params = new URLSearchParams(location.search);
const deviceId = params.get("device");

const state = {
  schema: null,
  // Altimeter-setting unit from the project's aircraft profile (#108), as the
  // device will receive it in preferences units.Pressure. inHg = pyEfis default.
  baroUnit: "inHg",
  // Aircraft references (FUEL1 F3): the shared resolver module
  // (/aircraft_refs.js, the one GET /device/config runs) and the profile's
  // items and retired labels per source, so a gauge bound to a tank previews
  // the dbkey and name the device will receive. null = no device / no module.
  aircraftRefs: null,
  // The tank-label module (/fuel_label.js, FUEL1 F6): the bar twin's name
  // line. null until it loads.
  fuelLabel: null,
  // A stock-bar migration being previewed in the twin (hover on its offer):
  // {inst, id}, or null.
  migrationPreview: null,
  // Panel colour theme (PANEL_THEMES id) the twin resolves colour tokens with.
  theme: "builtin",
  screen: { width: 1280, height: 800, inches: 10.1 },  // device physical display (shared by all screens)
  // A device can hold several screens (PFD / EMS / RADIO ...) the pilot switches
  // between. Each: { name, layout, instruments }. `layout` + `instruments` below
  // are ALIASES to screens[active] so the canvas code edits the active screen.
  screens: [{ name: "PANEL", layout: { rows: 110, columns: 200 }, instruments: [] }],
  active: 0,
  defaultScreen: "PANEL",        // which screen boots on the device
  layout: null,                  // -> screens[active].layout  (pyEfis normalised 110x200 grid)
  instruments: null,             // -> screens[active].instruments
  selected: -1,
  nestedSel: null,   // {ci, slot, ti, ii} of a selected tab_section child, or null (AER-345)
  canvasW: 0, canvasH: 0,
  snap: false,
  guides: "none",
  groups: [], groupsById: {},
};
state.layout = state.screens[0].layout;
state.instruments = state.screens[0].instruments;

// Point the active-screen aliases at screens[i]. The aliases share the SAME
// array/object references, so all the existing canvas code (push/splice/index on
// state.instruments) keeps screens[active] in sync automatically.
function setActive(i) {
  state.active = i;
  state.layout = state.screens[i].layout;
  state.instruments = state.screens[i].instruments;
  state.selected = -1;
  state.nestedSel = null;   // scoped to the previous screen's instruments
}

const SNAP = 10;  // grid cells; "Snap" rounds to this (aligned with the grid majors)
function snapTo(v) { return state.snap ? Math.round(v / SNAP) * SNAP : Math.round(v); }

// Text-bearing instruments are drawn live in the browser (HTML text in the
// chosen web font + colour), so font/colour/text changes preview accurately.
// Everything else uses the pre-rendered SVG.
const LIVE_TEXT = new Set(["static_text", "value_text", "numeric_display", "heading_display"]);
// Mirror of ValueDisplay._format_value: a digit mask. "" = as-is; "000" =
// rounded + zero-padded to 3 integer digits (089); "000.0" = + decimals.
function formatValue(value, fmt) {
  if (!fmt) return String(value);
  const v = Number(value);
  if (!isFinite(v)) return String(value);
  const dot = fmt.indexOf(".");
  if (dot >= 0) {
    const decimals = fmt.length - dot - 1, intdigits = dot;
    let s = v.toFixed(decimals), neg = s.startsWith("-"); if (neg) s = s.slice(1);
    let [ip, dp] = s.split(".");
    return (neg ? "-" : "") + ip.padStart(intdigits, "0") + (dp !== undefined ? "." + dp : "");
  }
  let s = Math.round(v).toString(), neg = s.startsWith("-"); if (neg) s = s.slice(1);
  return (neg ? "-" : "") + s.padStart(fmt.length, "0");
}

function sampleText(inst) {
  const o = inst.options || {};
  switch (inst.type) {
    case "static_text": return o.text || "Text";
    case "heading_display": return "360°";  // HeadingDisplay shows "NNN°"
    case "numeric_display": return o.pressure === true ? baroSample(o) : "123";
    // With a number format set, preview a formatted sample so the mask is
    // visible; otherwise fall back to the bound key name.
    case "value_text": return o.number_format ? formatValue(88.8, o.number_format) : (o.dbkey || "ABC");
    default: return inst.type;
  }
}

// A pressure numeric_display (e.g. the BARO box) previews the standard
// altimeter setting in the aircraft's unit, converted and formatted the way
// pyEfis does: funcPressHpa (screenbuilder_options) then
// '{:.{decimal_places}f}', decimal_places defaulting to 1 (gauges.AbstractGauge).
const BARO_STD_INHG = 29.92;
const INHG_TO_HPA = 33.863889532610884;
function baroSample(o) {
  const v = state.baroUnit === "hPa" ? BARO_STD_INHG * INHG_TO_HPA : BARO_STD_INHG;
  return v.toFixed(o.decimal_places ?? 1);
}

// pyEfis text-widget defaults, matched class-by-class so an unset font / size /
// alignment previews exactly what the device draws (fidelity rule):
//   static_text      misc.StaticText        DejaVu Sans Condensed, AlignLeft, full height
//   value_text       misc.ValueDisplay      Open Sans, AlignLeft, 0.9 height
//   numeric_display  gauges.NumericDisplay  DejaVu Sans Condensed, AlignLeft (fits "000")
//   heading_display  hsi.HeadingDisplay     DejaVu Sans Condensed, centred (fits "999")
// Colours are not here: an unset fg_color / bg_color previews the schema's
// default (the widget's own, exported from its Prop), so a pyEfis default
// change reaches the preview with the next schema.json and no edit here.
const TEXT_DEFAULTS = {
  static_text:     { font: "DejaVu Sans Condensed", pct: 1.0 },
  value_text:      { font: "Open Sans",             pct: 0.9 },
  numeric_display: { font: "DejaVu Sans Condensed", pct: 0.85 },
  heading_display: { font: "DejaVu Sans Condensed", pct: 0.75, bold: true, framed: true },
};
// Apply an opacity (0-1) to a hex colour -> rgba(); pass-through for names/opaque.
function rgbaFromColor(c, op) {
  if (op == null || op >= 1) return c;
  let h = String(c).trim();
  if (h[0] === "#") {
    if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
    const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    if (![r, g, b].some(Number.isNaN)) return `rgba(${r}, ${g}, ${b}, ${Math.max(0, op)})`;
  }

}
// bg_opacity is a percent (0-100) -> 0-1 fraction; default 1 (opaque) when unset.
function bgOpacity(o) {
  return o.bg_opacity != null ? Math.max(0, Math.min(1, Number(o.bg_opacity) / 100)) : 1;
}
// WCAG 2.x contrast + colour-derivation twin of pyefis.instruments.helpers
// (contrast_ratio / darken_to_contrast / SOURCE_LABEL_MIN_CONTRAST, AER-473 /
// pyEfis#147). Ported 1:1 -- same sRGB->linear luminance formula, same HSV
// value walk in `step` increments measured against the color's OWN
// (undarkened) value -- so the configurator lands on the exact colour the
// widget paints for both the stock and a custom source colour.
const SOURCE_LABEL_MIN_CONTRAST = 4.5;
function _hexToRgb(hex) {
  const h = normHex(hex) || "#000000";

}

}

}

function contrastRatio(fgHex, bgHex) {

}

  if (d !== 0) {

    else h = (r - g) / d + 4;

}
function _hsvToRgb([h, s, v]) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]

// Darken `hex` (same hue/saturation) until its contrast against its OWN
// original value clears `targetRatio` -- twin of helpers.darken_to_contrast.
function darkenToContrast(hex, targetRatio = SOURCE_LABEL_MIN_CONTRAST, step = 0.01) {
  const [h, s, v] = _rgbToHsv(_hexToRgb(hex));
  for (let vv = v; vv > 0; vv -= step) {
    const candidate = _rgbToHex(_hsvToRgb([h, s, vv]));
    if (contrastRatio(candidate, hex) >= targetRatio) return candidate;
  }
  return _rgbToHex(_hsvToRgb([h, s, 0]));
}
const _ALIGN_JUSTIFY = { AlignLeft: "flex-start", AlignCenter: "center", AlignRight: "flex-end" };
function textJustify(inst) {
  if (inst.type === "heading_display") return "center";      // HeadingDisplay centres
  if (inst.type === "static_text")                           // honours its alignment option
    return _ALIGN_JUSTIFY[(inst.options || {}).alignment] || "flex-start";
  return "flex-start";  // value_text + numeric_display are AlignLeft
}

// Live parametric gauges (arc + bar): drawn in the browser from the
// instrument's options, with a sample value + warn/alarm zones. The real value
// and bands are aircraft / FIX data (see #64), so the fill is representative.
const LIVE_GAUGE = new Set(["arc_gauge", "vertical_bar_gauge", "horizontal_bar_gauge"]);
const SVG_NS = "http://www.w3.org/2000/svg";
const GAUGE_FILL = 0.62;  // sample fill fraction (in the green zone)

function sampleGaugeValue(o) {
  const dec = o.decimal_places ?? 0;
  const num = dec > 0 ? (26.8).toFixed(dec) : "268";
  return num + (o.show_units ? "°" : "");
}

// The unbound look (pyEfis AbstractGauge.setUnbound, pyEfis#452): the
// widget's bad colour set, value text "xxx", the value held at 0 and no
// bands. A tank reference whose tank is gone is served this way (FUEL1 F5),
// so the twin draws it too. test/fuel_gauge_twin.test.mjs pins these to what
// tools/fuel_gauge_oracle.py reads off the real widgets.
const GAUGE_FAIL = { safe: "#808080", text: "#a0a0a4", pen: "#a0a0a4", value: "xxx" };

// The name line a bar draws (fuel_label.js nameLine, measured off the real
// widget): the first line of Qt's word wrap at device pixels, so a label too
// wide for the bar wraps or overflows where the device's does. The whole
// name until the module has loaded.
let _nameCtx = null;
function barNameLine(name, family, px, width) {
  const F = state.fuelLabel;
  if (!F || !name) return { text: name || "" };
  _nameCtx = _nameCtx || document.createElement("canvas").getContext("2d");
  _nameCtx.font = `${px}px "${family}"`;
  return F.nameLine(name, width, (t) => _nameCtx.measureText(t).width);
}

function buildBarGauge(inst, vertical) {
  const o = inst.options || {};
  const r = rect(inst);
  const fail = o.unbound === true;
  const family = o.font_family || "DejaVu Sans Condensed";
  const wrap = document.createElement("div");
  wrap.className = "gauge bargauge " + (vertical ? "vert" : "horiz") + (fail ? " fail" : "");
  wrap.style.color = fail ? GAUGE_FAIL.text : (o.fg_color || "#e6edf3");
  wrap.style.fontFamily = '"' + family + '"';
  // The name font as the widget sizes it, in device pixels: VerticalBar
  // smallFont = round(h * small_font_percent) over the full width,
  // HorizontalBar round(h / 12 * 2) from x = 1. Scaled to the canvas.
  const dev = mapDevicePx(inst), k = r.h / dev.h;
  const namePx = vertical ? Math.round(dev.h * (o.small_font_percent ?? 0.08)) : Math.round(dev.h / 6);
  const nameSz = namePx * k;
  const valSz = vertical ? Math.max(9, Math.min(22, r.w * 0.30))
                         : Math.max(9, Math.min(34, r.h * 0.33));
  const name = document.createElement("div"); name.className = "g-name";
  name.textContent = barNameLine(o.name || "", family, namePx, vertical ? dev.w : dev.w - 1).text;
  name.style.fontSize = nameSz + "px"; wrap.appendChild(name);
  const track = document.createElement("div"); track.className = "g-track";
  if (fail) track.style.background = GAUGE_FAIL.safe;
  const mark = document.createElement("div"); mark.className = "g-mark";
  if (fail) mark.style.background = GAUGE_FAIL.pen;
  const at = fail ? 0 : GAUGE_FILL;
  if (vertical) mark.style.bottom = (at * 100) + "%"; else mark.style.left = (at * 100) + "%";
  track.appendChild(mark); wrap.appendChild(track);
  const val = document.createElement("div"); val.className = "g-val";
  val.textContent = fail ? GAUGE_FAIL.value : sampleGaugeValue(o); val.style.fontSize = valSz + "px"; wrap.appendChild(val);
  return wrap;
}

function _polar(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
function _arcCW(cx, cy, r, a0, a1) {
  const p0 = _polar(cx, cy, r, a0), p1 = _polar(cx, cy, r, a1);
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return `M ${p0.x} ${p0.y} A ${r} ${r} 0 ${large} 1 ${p1.x} ${p1.y}`;
}
// Arc gauge -- faithful to pyEfis: a 180-deg sweep with colour zones, a white
// needle, the name top-left and the value lower-right.
// Arc gauge -- faithful to pyEfis ArcGauge: a wide 180-deg sweep with FIVE
// symmetric clearance zones (red-yellow-green-yellow-red), a white needle, the
// name top-left and the value lower-right. The zone band fractions + needle
// fill + sample value are representative (category-3 preview); the device uses
// real FIX min/max + warn/alarm aux (#64).
function buildArcGauge(inst) {
  const o = inst.options || {};
  // Unbound: no bands, so the whole sweep is the bad safe colour, the needle
  // rests at the low end and the text is the bad text colour (GAUGE_FAIL).
  const fail = o.unbound === true;
  const fg = fail ? GAUGE_FAIL.text : (o.fg_color || "#ffffff");
  const font = o.font_family || "DejaVu Sans Condensed";
  const meta = (state.schema && state.schema.instruments && state.schema.instruments[inst.type]) || {};
  const pv = meta.preview || {};
  const la = pv.low_alarm ?? 0.10, lw = pv.low_warn ?? 0.20, hw = pv.high_warn ?? 0.80, ha = pv.high_alarm ?? 0.90;
  const fill = fail ? 0 : (pv.fill ?? 0.72);
  // Wide layout (viewBox ~1.9:1) so the arc fills a 2:1 box like the real
  // ArcGauge (ratio 2) instead of letterboxing square.
  const cx = 50, cy = 44, r = 40, A0 = -90, SPAN = 180, sw = 9;
  const deg = (f) => A0 + f * SPAN, vdeg = deg(fill);
  const tip = _polar(cx, cy, r - 2, vdeg), bl = _polar(cx, cy, 2.5, vdeg - 90), br = _polar(cx, cy, 2.5, vdeg + 90);
  const valTxt = fail ? GAUGE_FAIL.value : pv.value !== undefined ? pv.value : sampleGaugeValue(o);
  const zone = (c) => fail ? GAUGE_FAIL.safe : c;
  const nameTxt = o.name || "DEMO";
  const nameEl = (o.name_location || "top") === "right"
    ? `<text x="97" y="12" fill="${fg}" font-size="9" font-family="${font}" text-anchor="end">${nameTxt}</text>`
    : `<text x="3" y="12" fill="${fg}" font-size="9" font-family="${font}">${nameTxt}</text>`;
  return svgFromString(`
<svg viewBox="0 0 100 52" preserveAspectRatio="xMidYMid meet" class="gauge-svg">
  <path d="${_arcCW(cx, cy, r, deg(0), deg(la))}" stroke="${zone("#e0231f")}" stroke-width="${sw}" fill="none"/>
  <path d="${_arcCW(cx, cy, r, deg(la), deg(lw))}" stroke="${zone("#e8c21a")}" stroke-width="${sw}" fill="none"/>
  <path d="${_arcCW(cx, cy, r, deg(lw), deg(hw))}" stroke="${zone("#22b03a")}" stroke-width="${sw}" fill="none"/>
  <path d="${_arcCW(cx, cy, r, deg(hw), deg(ha))}" stroke="${zone("#e8c21a")}" stroke-width="${sw}" fill="none"/>
  <path d="${_arcCW(cx, cy, r, deg(ha), deg(1))}" stroke="${zone("#e0231f")}" stroke-width="${sw}" fill="none"/>
  <path d="M${tip.x} ${tip.y} L${bl.x} ${bl.y} L${br.x} ${br.y} Z" fill="${fail ? GAUGE_FAIL.pen : "#fff"}"/>
  <circle cx="${cx}" cy="${cy}" r="2.5" fill="${fail ? GAUGE_FAIL.pen : "#fff"}"/>
  ${nameEl}
  <text x="98" y="50" fill="${fg}" font-size="19" font-weight="600" font-family="${font}" text-anchor="end">${valTxt}</text>

}

// Attitude indicator: sky/ground + roll + pitch ladder + aircraft symbol, drawn
// from a sample pitch/roll. Reflects symbol_color live.
let _svgUid = 0;
function svgFromString(s) { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstChild; }
function buildAttitude(inst) {
  // Category-3 preview pose from the instrument schema (no live FIX here).
  const meta = (state.schema && state.schema.instruments
    && state.schema.instruments[inst.type]) || {};
  const pv = meta.preview || {};
  const r = rect(inst);
  return svgFromString(attitudeSVG(inst,
    pv.pitch !== undefined ? pv.pitch : 4,
    pv.roll !== undefined ? pv.roll : -9,
    pv.slip !== undefined ? pv.slip : 2, true, r.w / r.h,
    mapDevicePx(inst).h));
}

// The flight director preview's sample command (AFC5, pyEfis#519), as the
// error from the preview attitude: 4 deg above it and 25 deg of bank to the
// left, the "both" column of pyEfis docs/aer-6052-evidence/styles.png. The
// bars show command minus attitude, so the picture is the same on any pose.
const FD_PREVIEW_ERROR = { pitch: 4, roll: -25 };
const FD_STYLES = ["single_cue", "cross_pointer", "off"];
const FD_ROLL_FULL_SCALE_DEG = 30;

// Port of pyEfis AI._draw_flight_director. Returns the magenta bars as SVG in
// attitudeSVG's symbol frame (viewBox units, origin at the fixed aircraft
// symbol), or "" for fd_style off. pitchErr / rollErr are command minus
// attitude in the device's sense (+ = nose up / right bank). The widget sizes
// the cue in device px (span off width, thickness off height, 1.5 px outline,
// px floors), so devH converts: one viewBox unit is devH * sc / 100 px.
function flightDirectorSVG(o, pitchErr, rollErr, opts) {

  let style = String(o.fd_style ?? "single_cue").toLowerCase();

  const re = ((rollErr + 180) % 360 + 360) % 360 - 180;
  const span = 16 * aspect * ss / sc;
  const thick = Math.max(3, devH * 0.014 * ss) / u;
  // Pinned inside the glass, so a large error still points the way.
  const margin = thick * 3, cy = 50 / sc - hoff, hh = 100 / sc;
  const ay = Math.max(margin - cy, Math.min(hh - margin - cy, y));
  const poly = (pts) => `<polygon points="${pts.map(([px, py]) =>
    `${px.toFixed(3)},${py.toFixed(3)}`).join(" ")}"/>`;
  let shapes;
  if (style === "cross_pointer") {
    const x = Math.max(-1, Math.min(1, re / FD_ROLL_FULL_SCALE_DEG)) * span;
    const t2 = thick / 2, yb = 50 + ay;
    shapes = poly([[50 - span, yb - t2], [50 + span, yb - t2], [50 + span, yb + t2], [50 - span, yb + t2]])
      + poly([[50 + x - t2, 50 - span], [50 + x + t2, 50 - span], [50 + x + t2, 50 + span], [50 + x - t2, 50 + span]]);
  } else {
    const gap = Math.max(2, devH * 0.006) / u, drop = span * 0.30;
    const c = Math.cos(re * Math.PI / 180), s = Math.sin(re * Math.PI / 180);
    shapes = poly([[0, -gap], [span, drop - gap], [span, drop - gap - thick],
      [0, -gap - thick * 1.6], [-span, drop - gap - thick], [-span, drop - gap]]
      .map(([px, py]) => [50 + px * c - py * s, 50 + ay + px * s + py * c]));
  }
  return `<g class="fd fd-${style}" fill="#ff00ff" stroke="#000000" stroke-width="${(1.5 / u).toFixed(4)}" stroke-linejoin="miter">${shapes}</g>`;
}

// Shared attitude symbology -- used by buildAttitude AND buildVirtualVfr (the SVS
// preview draws the SAME symbology over a captured clean-terrain image). Returns
// SVG markup. withBackground draws the sky/ground gradient; when false the SVG is
// transparent so the terrain <img> behind shows through.
// devH: the widget's height in device px, which sizes the flight director;
// fdErr: its command minus attitude (FD_PREVIEW_ERROR unless given).
function attitudeSVG(inst, pitch, roll, slip, withBackground, aspect, devH, fdErr = FD_PREVIEW_ERROR) {
  const o = inst.options || {};
  const sym = o.symbol_color || "#ffff00";
  const font = o.font_family || "DejaVu Sans Condensed";  // pyEfis AI uses self.font_family
  const id = _svgUid++;
  // Line-weight scale. Strokes are in the 100-unit viewBox and get magnified by
  // preserveAspectRatio (~boxWidth/100 on a wide SVS box), so a raw 1.1 renders
  // ~10x too thick. pyEfis draws its linework with a fontSize*0.05 pen ~= 0.1%
  // of the width (measured: 2px on a 1920 SVS). LW brings the twin to that ratio.
  const LW = 0.095;
  // Aspect compensation. preserveAspectRatio="slice" scales the square 100x100
  // viewBox by the LARGER box dimension and crops the other. On a WIDE SVS box it
  // scales by width and crops top/bottom, so pitch (pyEfis scales by height/fov)
  // and the bank arc (height/3) must be compressed by sc = max(1, W/H) to fit and
  // match the device. sc=1 for square/tall boxes leaves the attitude twin as-is.
  const sc = Math.max(1, aspect || 1);
  // Bank-cluster geometry (matches the pyEfis AI options): bank_radius is
  // percent of height (default 100/3 = the classic height/3), and
  // bank_position anchors the arc CENTRE, percent up from the bottom
  // (50 = the classic viewport centre). Vertical units compress by sc.
  const bankRadRaw = Number(o.bank_radius);
  const arcR = (isFinite(bankRadRaw) && bankRadRaw > 0
                ? bankRadRaw : 100 / 3) / sc;
  const bankPosRaw = Number(o.bank_position);
  const bankPos = (o.bank_position == null || o.bank_position === ""
                   || !isFinite(bankPosRaw)) ? 50 : bankPosRaw;
  const bankCy = 50 - (bankPos / 100 - 0.5) * (100 / sc);
  const arcTop = bankCy - arcR;        // top of the arc (bank pointer sits here)
  // symbol_scale multiplies the reference symbol's own dimensions.
  const symSc = Math.max(0.3, Math.min(3, Number(o.symbol_scale) || 1));
  // horizon_position: percent up the screen where the pitch=0 horizon sits
  // (50 = centred). pyEfis (_horizon_offset_px) raises the whole attitude
  // reference -- horizon, ladder, symbol, FPM, heading marks -- as a pure
  // screen-space vertical shift applied AFTER the roll rotation, so the
  // horizon keeps pivoting on the raised symbol at any bank. The bank scale,
  // bank pointer and slip ball stay anchored on the viewport centre.
  const hpRaw = Number(o.horizon_position);
  const hp = (o.horizon_position == null || o.horizon_position === ""
              || !isFinite(hpRaw)) ? 50 : hpRaw;
  const hoff = (hp / 100 - 0.5) * (100 / sc);  // viewBox units, positive = up
                                               // (visible height = 100/sc)
  // Pitch ladder, option-driven to match AI: viewBox 100 == the visible pitch
  // FOV, ticks at the minor/major/numbered division degrees, lengths from the
  // tick-width options, faded beyond the label range, at the ladder opacity.
  const fov = Number(o.pitchDegreesShown) || 30;
  const ppd = 100 / (sc * fov);
  const minorD = Math.max(1, Number(o.minorDiv) || 1);
  const majorD = Math.max(1, Number(o.majorDiv) || 5);
  const numD = Math.max(1, Number(o.numberedDiv) || 10);
  const labelRange = o.visiblePitchAngle != null ? Number(o.visiblePitchAngle) : 15;
  const ladderOp = o.pitchOpacity != null ? Number(o.pitchOpacity) : 0.6;
  // bankOpacity fades the whole bank cluster together (scale + roll pointer
  // + std-rate diamonds + datum triangle + slip ball); horizonOpacity fades
  // the zero-pitch line -- both match the pyEfis AI options.
  const bankOp = o.bankOpacity != null ? Number(o.bankOpacity) : 1;
  const horizonOp = o.horizonOpacity != null ? Number(o.horizonOpacity) : 1;
  const KW = 0.031;  // px tick-width -> viewBox half-width; pyEfis autoscales the
                     // widths to fontSize (numbered ~3.1% of width, not ~16%)
  const numHW = (Number(o.numberedDivWidth) || 50) * KW;
  const majHW = (Number(o.majorDivWidth) || 40) * KW;
  const minHW = (Number(o.minorDivWidth) || 10) * KW;
  let ladder = "";
  const span = Math.ceil(fov / 2) + Math.abs(pitch) + numD;
  for (let a = -span; a <= span; a += minorD) {
    if (a === 0) continue;                          // zero line is the horizon
    if (Math.abs(a - pitch) > labelRange) continue; // fade range
    if (o.pitch_ladder_avoid_bank) {
      // G1000-style declutter (matches the widget): the ladder climbs
      // into the bank arch but stops at the slip ball's bottom edge
      // (ball centre arcTop+1.9, r 0.5, plus a little air).
      const yRow = 50 - a * ppd + pitch * ppd;
      const yScr = 50 + (yRow - 50) * Math.cos(roll * Math.PI / 180) - hoff;
      if (yScr < arcTop + 2.7) continue;
    }
    const isNum = a % numD === 0, isMaj = a % majorD === 0;
    const hw = isNum ? numHW : (isMaj ? majHW : minHW);
    const sw = (isNum ? 0.7 : (isMaj ? 0.55 : 0.45)) * LW;
    const y = 50 - a * ppd;
    ladder += `<line x1="${(50 - hw).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(50 + hw).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#fff" stroke-width="${sw}" opacity="${ladderOp}"/>`;
    if (isNum) ladder += `<text x="${(50 - hw - 1).toFixed(1)}" y="${(y + 0.75).toFixed(1)}" fill="#fff" font-size="2.1" text-anchor="end" opacity="${ladderOp}">${a}</text>`
      + `<text x="${(50 + hw + 1).toFixed(1)}" y="${(y + 0.75).toFixed(1)}" fill="#fff" font-size="2.1" opacity="${ladderOp}">${a}</text>`;
  }
  let rollarc = "";
  for (const a of [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60]) {
    const maj = (a % 30 === 0), p1 = _polar(50, bankCy, arcR, a), p2 = _polar(50, bankCy, arcR * (maj ? 0.889 : 0.944), a);
    rollarc += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#fff" stroke-width="${(maj ? 0.9 : 0.6) * LW}"/>`;
  }
  // Standard-rate bank markers (diamonds) -- shown when drawBankMarkers is on,
  // at a representative bank clamped to the max-indicated-bank option (no live
  // TAS in the editor). Fixed on the scale, like the widget.
  let bankMarks = "";
  if (o.drawBankMarkers !== false) {
    const ba = Math.min(15, Number(o.bankAngleMaximum) || 25);
    const ms = (Number(o.bankMarkSize) || 10) * 0.08;
    for (const s of [-1, 1]) {
      const c = _polar(50, bankCy, arcR, s * ba);
      bankMarks += `<path d="M${c.x.toFixed(1)} ${(c.y - ms).toFixed(1)} L${(c.x + ms * 0.7).toFixed(1)} ${c.y.toFixed(1)} L${c.x.toFixed(1)} ${(c.y + ms).toFixed(1)} L${(c.x - ms * 0.7).toFixed(1)} ${c.y.toFixed(1)} Z" fill="none" stroke="#fff" stroke-width="${0.6 * LW}"/>`;
    }
  }
  // Aircraft reference symbol -- must match pyefis ai._draw_aircraft_symbol:
  //   "garmin"   = GI-275/G1000 tapered wedges + boresight ring
  //   "brackets" = GRT-style flat bars with an inboard down-tick (L shapes)
  //   "classic"  = split-wing bars + centre dot (default)
  const symStyle = String(o.aircraft_symbol || "classic").toLowerCase();
  let symbol;
  if (["none", "off", "hidden"].includes(symStyle)) {
    // SVS-as-background mode: no fixed reference symbol (matches the
    // widget's _draw_aircraft_symbol early return).
    symbol = "";
  } else if (symStyle === "garmin") {
    // Garmin G3X-style bat wing (matches ai._draw_aircraft_symbol): two
    // slender anhedral triangles sweeping down-outboard from a notched apex
    // on the horizon, each split lengthwise into a lit upper face (symbol
    // colour) and a Qt darker(165) lower face, plus two-tone pill barbs
    // riding the horizon at +/-35% width. Wing dims are width-derived in
    // pyEfis, so they are plain viewBox units; the barb thickness is
    // height-derived, so it divides by the aspect (sc).
    const dk = (hex => {   // Qt darker(165): divide RGB by 1.65
      const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
      if (!m) return "#8f8f00";
      const v = parseInt(m[1], 16);
      const f = x => Math.round(x / 1.65);
      return `rgb(${f(v >> 16 & 255)},${f(v >> 8 & 255)},${f(v & 255)})`;
    })(sym);
    const gp = 1.2 * symSc, sp = 15 * symSc, dr = 4.5 * symSc,
          rt = 2.4 * symSc;                        // gap/span/drop/thickness
    const bl = 6.2 * symSc, bx = 35 * symSc,
          bh = 2.4 * symSc / sc;                   // barb len/offset/thickness
    const ow = 0.6 * LW;                            // hairline outline
    let g = `<g stroke="#000" stroke-width="${ow}">`;
    for (const s of [-1, 1]) {
      // sharp apex at centre on the horizon; wing widens outboard and the
      // base is cut on a slant -- the bottom corner runs further out and
      // down, the drooped G3X tip (points at the TOP, like the G3X)
      const xi = 50 + s * gp, xo = 50 + s * (gp + sp), xt = xo + s * sp * 0.12;
      const mx = (xo + xt) / 2, my = 50 + dr + rt * 0.5;
      g += `<polygon points="${xi},50 ${xo},${50 + dr} ${mx},${my}" fill="${sym}"/>`
         + `<polygon points="${xi},50 ${mx},${my} ${xt},${50 + dr + rt}" fill="${dk}"/>`;
      const x0 = 50 + s * bx - bl / 2;
      g += `<rect x="${x0}" y="${(50 - bh / 2).toFixed(2)}" width="${bl}" height="${bh.toFixed(2)}" rx="${(bh / 2).toFixed(2)}" fill="${sym}"/>`
         + `<rect x="${x0}" y="50" width="${bl}" height="${(bh / 2).toFixed(2)}" rx="${(bh / 4).toFixed(2)}" fill="${dk}"/>`;
    }
    symbol = g + "</g>";
  } else if (["brackets", "grt", "l", "l-bracket", "l_bracket"].includes(symStyle)) {
    // GRT-style flat bars with an inboard down-tick -- slimmed to the device
    // weight. Centre-relative so symbol_scale grows them around the anchor
    // (inner edge 7, bar 14, tick 1.4 at scale 1 = the historical layout).
    const bi = 7 * symSc, bwid = 14 * symSc, bth = 0.4 * symSc,
          btk = 1.4 * symSc, bd = 0.45 * symSc;
    symbol = `<g fill="${sym}">
      <rect x="${(50 - bi - bwid).toFixed(2)}" y="${(50 - bth / 2).toFixed(2)}" width="${bwid.toFixed(2)}" height="${bth.toFixed(2)}"/>
      <rect x="${(50 - bi - bth * 1.25).toFixed(2)}" y="${(50 - bth / 2).toFixed(2)}" width="${(bth * 1.25).toFixed(2)}" height="${btk.toFixed(2)}"/>
      <rect x="${(50 + bi).toFixed(2)}" y="${(50 - bth / 2).toFixed(2)}" width="${bwid.toFixed(2)}" height="${bth.toFixed(2)}"/>
      <rect x="${(50 + bi).toFixed(2)}" y="${(50 - bth / 2).toFixed(2)}" width="${(bth * 1.25).toFixed(2)}" height="${btk.toFixed(2)}"/>
      <circle cx="50" cy="50" r="${bd.toFixed(2)}"/>
    </g>`;
  } else {
    // classic split-wing bars + centre dot. Bars stay wide (the symbol span)
    // but THIN -- pyEfis draws them ~4px on a 1920 SVS (~0.2% of width), so the
    // fill height matches the linework weight rather than a fat 2.4-unit bar.
    // Centre-relative: inner edge 10, bar 20 at scale 1 = historical layout.
    const ci = 10 * symSc, cwid = 20 * symSc, cth = 0.4 * symSc,
          cd = 0.5 * symSc;
    symbol = `<g fill="${sym}">
      <rect x="${(50 - ci - cwid).toFixed(2)}" y="${(50 - cth / 2).toFixed(2)}" width="${cwid.toFixed(2)}" height="${cth.toFixed(2)}" rx="${(cth * 0.375).toFixed(2)}"/>
      <rect x="${(50 + ci).toFixed(2)}" y="${(50 - cth / 2).toFixed(2)}" width="${cwid.toFixed(2)}" height="${cth.toFixed(2)}" rx="${(cth * 0.375).toFixed(2)}"/>
      <circle cx="50" cy="50" r="${cd.toFixed(2)}"/>
    </g>`;
  }
  // Flight-path marker (matches ai._drawFPM): a green boresight CIRCLE with two
  // side wings + a top stem, not a chevron. Shown unless show_fpm is off. Placed
  // at a representative drift offset; thin stroke like the rest of the linework.
  const fr = 0.4;               // fpm circle radius = pyEfis bankMarkSize*0.65 (~0.4% W)
  const fx = 57, fy = 50;       // representative flight-path position
  const fpm = (o.show_fpm === false) ? ""
    : `<g fill="none" stroke="#37d36b" stroke-width="${2 * LW}">
      <circle cx="${fx}" cy="${fy}" r="${fr}"/>
      <line x1="${fx - fr * 2.4}" y1="${fy}" x2="${fx - fr * 1.1}" y2="${fy}"/>
      <line x1="${fx + fr * 1.1}" y1="${fy}" x2="${fx + fr * 2.4}" y2="${fy}"/>
      <line x1="${fx}" y1="${fy - fr * 1.1}" x2="${fx}" y2="${fy - fr * 2}"/>
    </g>`;
  // Flight director (AFC5): the single cue goes under the aircraft symbol,
  // which nests in it; the cross-pointer bars cross over it. Under SVS the
  // pitch error uses the terrain camera's tangent, as the ladder does there.
  const fd = flightDirectorSVG(o, fdErr.pitch, fdErr.roll,
    { sc, aspect: aspect || 1, devH: devH || 300, ppd, hoff, conformal: !withBackground });
  const fdCue = fd.includes("fd-single_cue") ? fd : "";
  const fdBars = fd.includes("fd-cross_pointer") ? fd : "";
  // Compass heading scale on the horizon (matches ai._draw_horizon_heading):
  // ticks every interval deg + an upright label every label-interval deg, on
  // the y=50 horizon line so it rides the rolled/pitched horizon. Sample
  // heading for the preview. Labels counter-rotate (-roll) to stay upright.
  let headingMarks = "";
  if (o.horizon_heading_marks) {
    const hHead = 0;
    const hIv = Math.max(1, Number(o.horizon_heading_interval) || 10);
    const hLiv = Math.max(hIv, Number(o.horizon_heading_label_interval) || 20);
    const hCol = o.horizon_heading_color || "#ffffff";
    const hTick = (Number(o.horizon_heading_tick_length) || 5) / 5 * 1;
    for (let m = 0; m < 360; m += hIv) {
      const d = ((m - hHead + 180) % 360) - 180, x = 50 + d * ppd;
      if (x < 2 || x > 98) continue;
      headingMarks += `<line x1="${x.toFixed(1)}" y1="50" x2="${x.toFixed(1)}" y2="${(50 - hTick).toFixed(1)}" stroke="${hCol}" stroke-width="${0.5 * LW}"/>`;
      if (m % hLiv === 0) {
        const lbl = (m === 0) ? "N" : m === 90 ? "E" : m === 180 ? "S" : m === 270 ? "W" : String(Math.floor(m / 10));
        const ly = (50 - hTick - 1).toFixed(1);
        headingMarks += `<text x="${x.toFixed(1)}" y="${ly}" fill="${hCol}" font-size="1.8" text-anchor="middle" transform="rotate(${-roll} ${x.toFixed(1)} ${ly})">${lbl}</text>`;
      }
    }
  }
  return `
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" class="gauge-svg" font-family="${font.replace(/"/g,'')}">
  <defs>
    <clipPath id="aic${id}"><rect x="0" y="0" width="100" height="100"/></clipPath>
    <linearGradient id="ais${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6fd0"/><stop offset="1" stop-color="#57a0e8"/></linearGradient>
    <linearGradient id="aig${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5328"/><stop offset="1" stop-color="#553619"/></linearGradient>
  </defs>
  <g clip-path="url(#aic${id})">
    <g transform="translate(0 ${(-hoff).toFixed(2)})"><g transform="rotate(${roll} 50 50)"><g transform="translate(0 ${pitch * ppd})">
      ${withBackground ? `<rect x="-90" y="-170" width="280" height="220" fill="url(#ais${id})"/>
      <rect x="-90" y="50" width="280" height="220" fill="url(#aig${id})"/>` : ``}
      <line x1="-90" y1="50" x2="190" y2="50" stroke="#fff" stroke-width="${1.1 * LW}" opacity="${horizonOp}"/>
      ${ladder}
      ${headingMarks}
    </g></g></g>
    ${bankOp > 0 ? `<g opacity="${bankOp}">
    <g transform="rotate(${roll} 50 ${bankCy.toFixed(2)})">${rollarc}</g>
    ${bankMarks}
    <path d="M49.65 ${(arcTop - 0.8).toFixed(2)} L50.35 ${(arcTop - 0.8).toFixed(2)} L50 ${(arcTop + 0.1).toFixed(2)} Z" fill="#fff"/>
    <circle cx="${(50 + slip).toFixed(1)}" cy="${(arcTop + 1.9).toFixed(2)}" r="0.5" fill="#fff"/>
    </g>` : ``}
    <g transform="translate(0 ${(-hoff).toFixed(2)})">
      ${fdCue}
      ${symbol}
      ${fpm}
      ${fdBars}
    </g>
  </g>
</svg>`;
}

// --- autopilot target cues on the tapes (AER-6286) ---------------------------
// pyEfis #499 (AFC4): the IASSEL box and bug on Airspeed_Tape, the ALTSEL
// box's capture look and the VSSEL bug on Altimeter_Tape, the VSSEL bug on
// VSI_PFD. On the device each shows only while the autopilot reports its mode;
// the preview shows them in the states of pyEfis's own evidence sheet
// (docs/aer-5808-evidence/tapes.png): IAS active at 90 kt, the ALTSEL box
// capturing 4,000 ft, VS active at +500 fpm (the ap_annunciator preview's).
// Each cue's shape is a port of the device's paint, pinned by
// tools/ap_tape_cues_oracle.py; where it sits follows the editor's own tape
// scale, which is an approximation of the device's.
const AP_CUE_PREVIEW = { iassel: 90, altsel: 4000, vssel: 500, vs: 480 };
// bugs.tape_bug_path: a block standing on the edge at x, its V notch facing
// the scale (pointRight: the scale is to the right of x), apex on y.
function tapeBugPath(x, y, width, height, pointRight) {
  const h2 = height / 2, nh = height / 3, nd = width * 0.45, s = pointRight ? 1 : -1, far = x + s * width;
  return [[x, y - h2], [far, y - h2], [far, y - nh / 2], [far - s * nd, y], [far, y + nh / 2], [far, y + h2], [x, y + h2]];
}
// An option the device reads as on unless it is set false (YAML or a string).
function apCueOn(v, dflt) {
  if (v == null || v === "") return dflt;
  if (typeof v === "string") return ["true", "1", "yes", "on"].includes(v.trim().toLowerCase());
  return Boolean(v);
}
// The cues one tape draws, in device px: { boxes, bugs }. bugY maps a value
// on this tape's scale to y. A box is helpers.draw_readout_panel plus its
// text; a bug is a filled tapeBugPath, pegged as bugs.clamp_to_span pegs it.
function apTapeCues(type, o, w, h, bugY, tasTop) {
  o = o || {};
  const boxes = [], bugs = [], clamp = (y, lo, hi) => Math.min(hi, Math.max(lo, y));
  const family = o.font_family || "DejaVu Sans Condensed";
  if (type === "airspeed_tape" && apCueOn(o.ias_bug, true)) {
    // ias_box_zone: the box's height plus the edit ring's margin each side.
    const m = 4.5, zh = Math.max(16, Math.round(w * 0.30)) + 2 * m;
    const r = { x: m, y: m, w: w - 2 * m, h: zh - 2 * m };
    const color = apColor(o.ias_bug_color || "#00ffff");
    boxes.push({ which: "iassel", rect: r, radius: 0.145 * r.h, stroke: ["#00ff00", 0.85],
      strokeW: Math.max(1, r.h * 0.05), fill: 1, text: String(AP_CUE_PREVIEW.iassel), color,
      px: Math.max(6, Math.round(r.h * 0.62)), bold: true, family,
      icon: apCueOn(o.touch_edit, true) ? editIconGeom(r, w) : null });
    const y = clamp(bugY(AP_CUE_PREVIEW.iassel), zh + 1, tasTop);
    bugs.push({ which: "iassel", points: tapeBugPath(w, y, Math.max(5, w * 0.10), Math.max(10, w * 0.24), false), color });
  }
  if (type === "altimeter_tape") {
    const dbkey = o.dbkey || "ALT";
    let top = 0;
    if (apCueOn(o.altsel_box, dbkey === "ALT")) {
      // AltSelBox at (0, 0, w, bh), its value rect inset for the edit ring,
      // in the capture look: altsel_capture_color, the border twice as thick.
      const bh = Math.max(16, Math.round(w * 0.34)), m = 4.5;
      const r = { x: m, y: m, w: w - 2 * m, h: bh - 2 * m };
      // draw_readout_panel sets the border's alpha to 0.85 whatever the colour's.
      const pt = apFitToMask(r.w * 0.86, r.h * 0.78, "00000", family);
      boxes.push({ which: "altsel", rect: r, radius: 0.145 * r.h,
        stroke: [apColor(o.altsel_capture_color || "#00ff00")[0], 0.85],
        strokeW: Math.max(1, r.h * 0.10), fill: 1, text: String(AP_CUE_PREVIEW.altsel),
        color: apColor(o.alt_bug_color || "#00ffff"), px: Math.max(1, pt) * 96 / 72, pt, bold: false, family,
        icon: editIconGeom(r, w) });
      top = bh;
    }
    if (apCueOn(o.vs_bug, dbkey === "VS")) {
      const y = clamp(bugY(AP_CUE_PREVIEW.vssel), top, h);
      bugs.push({ which: "vssel", points: tapeBugPath(w, y, Math.max(5, w * 0.12), Math.max(10, w * 0.26), false),
        color: apColor(o.vs_bug_color || "#00ffff") });
    }
  }
  if (type === "vsi_pfd" && apCueOn(o.vs_bug, true)) {
    const y = clamp(bugY(AP_CUE_PREVIEW.vssel), 0, h);
    bugs.push({ which: "vssel", points: tapeBugPath(0, y, Math.max(5, w * 0.30), Math.max(8, w * 0.45), true),
      color: apColor(o.vs_bug_color || "#00ffff") });
  }
  return { w, h, boxes, bugs };
}
function apTapeCuesSvg(g) {
  if (!g.boxes.length && !g.bugs.length) return "";

  for (const b of g.bugs) {
    out.push(`<path data-cue="${b.which}" d="M ${b.points.map((p) => p.join(" ")).join(" L ")} Z" fill="${apEsc(b.color[0])}" fill-opacity="${b.color[1]}"/>`);
  }
  for (const b of g.boxes) {
    const r = b.rect;
    out.push(`<rect data-cue="${b.which}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${b.radius}" ry="${b.radius}" fill="#000000" fill-opacity="${b.fill}"` +
      ` stroke="${apEsc(b.stroke[0])}" stroke-opacity="${b.stroke[1]}" stroke-width="${b.strokeW}"/>`);
    out.push(`<text x="${r.x + r.w / 2}" y="${r.y + r.h / 2}" dominant-baseline="central" text-anchor="middle" font-family="${apEsc(b.family)}" font-size="${b.px}"` +
      `${b.bold ? ' font-weight="bold"' : ""} fill="${apEsc(b.color[0])}" fill-opacity="${b.color[1]}">${apEsc(b.text)}</text>`);
    if (b.icon) out.push(editIconSvg(b.icon));
  }
  out.push("</svg>");
  return out.join("\n");
}

// Vertical tape (airspeed / altimeter): scrolling numbers around a sample value
// with a centred readout box. HTML (not SVG) so the digits never distort.
// Vertical tape. Airspeed adds the V-speed colour bands, a TAS box across the
// bottom (show_tas) and a cyan trend arrow (show_trend) to match the real
// Airspeed_Tape; sample IAS/TAS/trend are category-3 preview.
function buildTape(inst) {
  const o = inst.options || {};
  const isAlt = inst.type === "altimeter_tape";
  const meta = (state.schema && state.schema.instruments && state.schema.instruments[inst.type]) || {};
  const pv = meta.preview || {};
  // A VS tape (dbkey VS) previews AP_CUE_PREVIEW's climb, not an altitude.
  const isVs = isAlt && (o.dbkey || "ALT") === "VS";
  const value = isVs ? AP_CUE_PREVIEW.vs : isAlt ? 3500 : (pv.value ?? 110), step = isAlt ? 200 : 20, span = 6 * step;
  const r = rect(inst);
  const wrap = document.createElement("div");
  wrap.className = "gauge tape" + (isAlt ? " alt" : "");
  if (o.edge_fade) {
    // Mirrors the device's edge_fade: scale melts out over the top/bottom 15%.
    const m = "linear-gradient(transparent, black 15%, black 85%, transparent)";
    wrap.style.webkitMaskImage = m; wrap.style.maskImage = m;
  }
  wrap.style.fontFamily = '"' + (o.font_family || "DejaVu Sans Condensed") + '"';
  wrap.style.fontSize = Math.max(7, Math.min(14, r.w * 0.24)) + "px";
  if (o.fg_color) wrap.style.color = o.fg_color;
  if (!isAlt) wrap.appendChild(Object.assign(document.createElement("div"), { className: "vbands" }));
  const showTas = !isAlt && o.show_tas !== false;
  const botPad = showTas ? 18 : 0;   // % reserved at the bottom for the TAS box
  const base = Math.round(value / step) * step;
  for (let k = -4; k <= 4; k++) {
    const n = base + k * step, top = 50 - (n - value) / span * 100;
    if (top < 3 || top > 97 - botPad) continue;
    const tk = document.createElement("div"); tk.className = "tk";
    tk.style.top = top + "%"; tk.textContent = n; wrap.appendChild(tk);
  }
  const ro = document.createElement("div"); ro.className = "readout notch"; ro.textContent = value;
  // The value fills its box on the device -- NumericalDisplay grows the font
  // until total_decimals digits span the box interior. Both tapes land on
  // roughly a quarter of the tape width per digit-height, so one coefficient
  // covers both (IAS: 3 digits in w/2; ALT: 5 digits in w/1.2).
  ro.style.fontSize = Math.max(9, r.w * 0.25) + "px";
  if (showTas) ro.style.top = (50 - botPad / 2) + "%";
  wrap.appendChild(ro);
  if (!isAlt && o.show_trend !== false) {
    // Anchored just left of the readout box, as the widget draws it (x0 = -2
    // from numeric_box_pos, i.e. the box's left edge at w/2).
    const tr = pv.trend ?? 6, trh = Math.max(4, Math.min(22, tr * 1.6));
    const trend = document.createElement("div");
    trend.style.cssText = `position:absolute;left:46%;width:3px;background:#34d3ff;top:${50 - botPad / 2 - trh}%;height:${trh}%;`;
    const head = document.createElement("div");
    head.style.cssText = `position:absolute;left:44.5%;top:${50 - botPad / 2 - trh}%;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid #34d3ff;`;
    wrap.appendChild(trend); wrap.appendChild(head);
  }
  if (showTas) {
    const tas = document.createElement("div");
    tas.className = "tasbox";
    const tasH = (botPad - 2) / 100 * r.h;
    tas.style.height = (botPad - 2) + "%";
    // box_h * helpers.READOUT_RADIUS_RATIO (.145, AER-413) -- see the .tasbox
    // comment above for why this is computed in px rather than a fixed em.
    tas.style.borderRadius = (tasH * 0.145) + "px";
    tas.innerHTML = `<div class="lbl">TAS</div><div class="val">${pv.tas ?? 118}</div>`;
    wrap.appendChild(tas);
  }
  // The autopilot cues, in device px over the tape, placed on this tape's
  // scale (ticks: top% = 50 - (n - value) / span * 100).
  const dev = mapDevicePx(inst);
  const cues = apTapeCuesSvg(apTapeCues(inst.type, o, dev.w, dev.h,
    (v) => (50 - (v - value) / span * 100) / 100 * dev.h, (100 - botPad) / 100 * dev.h));
  if (cues) wrap.appendChild(svgFromString(cues));
  return wrap;
}

function headingLabel(d) {
  d = ((d % 360) + 360) % 360;
  return ({ 0: "N", 90: "E", 180: "S", 270: "W" })[d] || String(d / 10);
}

// Heading tape: a horizontal compass strip scrolling around a sample heading,
// with a lubber index + readout box. HTML so the labels stay crisp.
function buildHeadingTape(inst) {
  const o = inst.options || {};
  const heading = 87, span = 90;
  const r = rect(inst);
  const wrap = document.createElement("div");
  wrap.className = "gauge htape";
  wrap.style.fontFamily = '"' + (o.font_family || "DejaVu Sans Condensed") + '"';
  wrap.style.fontSize = Math.max(7, Math.min(14, r.h * 0.3)) + "px";
  if (o.fg_color) wrap.style.color = o.fg_color;
  const base = Math.round(heading / 10) * 10;
  for (let hd = base - 50; hd <= base + 50; hd += 10) {
    const left = 50 + (hd - heading) / span * 100;
    if (left < 2 || left > 98) continue;
    const norm = ((hd % 360) + 360) % 360, maj = norm % 30 === 0, card = norm % 90 === 0;
    const tk = document.createElement("div");
    tk.className = "htk" + (maj ? " maj" : "");
    tk.style.left = left + "%";
    const bar = document.createElement("span"); bar.className = "bar"; tk.appendChild(bar);
    if (maj) { const lbl = document.createElement("span"); lbl.className = "lbl" + (card ? " card" : ""); lbl.textContent = headingLabel(norm); tk.appendChild(lbl); }
    wrap.appendChild(tk);
  }
  wrap.appendChild(Object.assign(document.createElement("div"), { className: "hlubber" }));
  return wrap;
}

// Horizontal situation indicator -- faithful to the pyEfis HSI widget: a
// rotating compass card (ticks + labels), a small selected-course pointer
// (course_color, driven by COURSE), fixed yellow lubber index marks, the
// CDI/GSI cross-pointer deviation needles over a centre deviation scale, and an
// optional Garmin-style cyan heading bug (heading_bug_color). With
// source_auto_color on (default) the course pointer + CDI/GSI are coloured by
// nav source -- the preview shows a GPS source (magenta); a VOR/LOC source uses
// vloc_color (green). Off, the needles use needle_color. Reflects fg_color,
// bg_opacity and the cdi/gsi toggles.
function buildHSI(inst) {
  // Twin of the pyEfis HSI (P5a redesign). Faithful to the widget: rotating card
  // (heading-up) with UPRIGHT numerals, tick weight/length hierarchy, a top
  // lubber triangle (no yellow cardinal marks), a centre aircraft symbol,
  // optional depth rings (default off), the source-coloured course/CDI/TO-FROM
  // assembly + glideslope, and layout-selectable integral readouts.
  const o = inst.options || {};
  const fg = o.fg_color || "#ffffff";
  const font = (o.font_family || "DejaVu Sans Condensed").replace(/"/g, '');
  const needleW = (o.needle_width != null ? Number(o.needle_width) : 3) * 0.4;
  const courseC = o.course_color || "#ff00ff";
  const hbC = o.heading_bug_color || "#00ffff";
  const trackC = o.track_color || "#ff00ff";
  const autoColor = o.source_auto_color !== false;
  const navColor = autoColor ? courseC : (o.needle_color || "#ffff00");
  const layout = o.readout_layout || "top_panel";
  const numScale = o.numeral_scale != null ? Number(o.numeral_scale) : 1.5;
  const depthRings = o.depth_rings === true;              // default off
  const centerSym = o.center_symbol || "aircraft";
  const heading = 87, course = 110, headbug = 50, track = 78;  // sample values
  const cdi = 0.3, gsi = -0.2, tofrom = 1;
  // Bearing pointers (HSIBRG1, pyEfis#464): every needle, label and the BRG
  // tab is bearing_color (cyan) whatever its source -- source colour is the
  // CDI's alone (HSI-COLOR-001). bearingN_enabled only makes a pointer
  // available; at run time each starts Off until the pilot steps it on, so
  // the preview shows the panel as it boots: no needles, the BRG tab reading
  // NONE (or the corner labels reading OFF). brgOn twins HSI._brgOn at boot.
  // Each pointer has one fixed source (HSIBRG4, pyEfis#504): 1 is VOR1, 2 is
  // VOR2, as BRGnSRC values (HSI._BEARING_SOURCE). A pointer whose source is
  // the CDI's is not offered (_bearing_offered). The preview's CDI is GPS
  // (cdiSrc, NAVSRC 2), so today both are always offered.
  const bearingC = o.bearing_color || "#00ffff";
  const brg1 = 30, brg2 = 250;                             // sample values
  const cdiSrc = 2;
  const BEARING_SOURCE = { 1: 0, 2: 1 };
  const brgAvail = [1, 2].filter((n) => o[`bearing${n}_enabled`]);
  const brgOffered = brgAvail.filter((n) => BEARING_SOURCE[n] !== cdiSrc);
  const brgOn = { 1: false, 2: false };
  // The widget's fontSize in this viewBox: its top panel is 12.5 fontSize
  // wide (_draw_readouts), and the twin's panel is 44.
  const FS = 44 / 12.5;

  // Turn-rate trend (ATT1b, pyEfis#520) -- twin of HSI._turn_trend_deg /
  // _turn_trend_marks: an arc from the lubber to the heading reached in 6 s at
  // the present ROT, fixed white marks at half (9 deg) and standard (18 deg)
  // rate each side, and above 4 deg/s the arc stops at 24 deg with an
  // arrowhead. Screen-fixed at the lubber, not the card. The preview shows a
  // standard-rate right turn (rotSample), so the arc ends on the long mark.
  const turnOn = o.turn_rate_enabled !== false;
  const turnC = o.turn_rate_color || "#ff00ff";
  const rotSample = 3;                                      // deg/s, + = right
  const TT_SEC = 6, TT_STD = 3 * TT_SEC, TT_LIM = 4 * TT_SEC;
  const ttMarks = [-TT_STD, -TT_STD / 2, TT_STD / 2, TT_STD];
  const ttRaw = rotSample * TT_SEC, ttCapped = Math.abs(ttRaw) > TT_LIM;
  const ttDeg = ttCapped ? Math.sign(ttRaw) * TT_LIM : ttRaw;
  const ttMarkW = Math.max(0.25, FS * 0.08), ttArcW = Math.max(0.5, FS * 0.2);

  // Every label the widget's nav-source tab can show (GPS, VOR/LOC/VLOC x
  // NAV1/NAV2) -- twin of hsi._SOURCE_TAB_LABELS (pyEfis#148/AER-473). Width
  // is measured against the widest of these, not the label actually drawn,
  // so the tab doesn't breathe as NAVSRC cycles and centring falls out free.
  const SOURCE_TAB_LABELS = ["GPS", "VOR1", "VOR2", "LOC1", "LOC2", "VLOC1", "VLOC2"];

  // The two tabs hanging off the top panel, the nav-source tab on the left
  // and the BRG tab on the right, share one geometry -- twin of
  // HSI._side_tab_metrics (HSIBRG4, pyEfis#504): top at the bottom of the
  // panel's corner arc, height the straight run of the panel's edge, the
  // panel's corner radius, and the font at fontSize, not bold. Width is the
  // widest of SOURCE_TAB_LABELS plus 0.35 fontSize a side, so neither tab
  // breathes as its label changes. Glyph widths are DejaVu Sans Condensed's
  // own advances and kerning (ndAdvance), taken at 2048 px a side so no
  // per-glyph rounding enters; the widget's are hinted to whole px, so the
  // width sits 0.07 units (0.3 px) under the widget's at 425 px.
  const sideTab = (py, ph, rr) => {
    const th = ph - 2 * rr, pad = FS * 0.35;
    const w = Math.max(...SOURCE_TAB_LABELS.map((l) => ndAdvance(l, 2048, false))) / 2048 * FS + 2 * pad;
    return { top: py + rr, th, r: Math.min(rr, th / 2), w, size: FS };
  };

  // Nav-source tab (AER-388/pyEfis#140): a coloured tab hanging off the
  // HDG|MAG|CRS panel's left edge, in `top_panel` layout only -- twin of
  // HSI._draw_source_tab, sized by sideTab. rr is the radius the panel's own
  // rx uses. No stroke of its own -- the panel is painted after (see call
  // sites) so its own left border draws over the seam instead of doubling it.
  const navTab = (px, py, ph, rr, color, label) => {
    const { top, th, r, w: tw, size } = sideTab(py, ph, rr);
    const x0 = px - tw, x1 = px, y0 = top, y1 = top + th;
    const d = `M${x0 + r} ${y0} L${x1} ${y0} L${x1} ${y1} L${x0 + r} ${y1} `
      + `A${r} ${r} 0 0 1 ${x0} ${y1 - r} L${x0} ${y0 + r} A${r} ${r} 0 0 1 ${x0 + r} ${y0} Z`;
    // Label is a darkened tint of the tab's own fill (pyEfis#147/AER-473),
    // not hardcoded white -- the fill (`color`) is config-selectable and
    // stays at full brightness (HSI-COLOR-001); only the label darkens.
    return `<path d="${d}" fill="${color}"/>`
      + `<text x="${x0 + tw / 2}" y="${(y0 + y1) / 2 + size * 0.35}" fill="${darkenToContrast(color)}" font-size="${size}" text-anchor="middle">${label}</text>`;
  };

  // BRG tab (HSIBRG1, one button since HSIBRG4, pyEfis#504): the
  // bearing-pointer selector on the RIGHT edge of the HDG|MAG|CRS panel,
  // `top_panel` only -- twin of HSI._draw_bearing_tab. It is navTab mirrored:
  // the same sideTab geometry and font, a square left edge flush with the
  // panel (px is the panel's right edge) and rounded right corners. Drawn
  // only when a pointer is available. The label is the state, NONE / BRG 1 /
  // BRG 2 / BOTH (HSI._BEARING_STATES); with a needle on the tab is filled
  // bearing_color with a darkened label, at NONE it is the panel's dark fill
  // with a cyan label and outline. The outline leaves the shared edge to the
  // panel's border, painted after.
  const BEARING_STATES = [["NONE", []], ["BRG 1", [1]], ["BRG 2", [2]], ["BOTH", [1, 2]]];
  const bearingTab = (px, py, ph, rr, stroke) => {
    if (!brgAvail.length) return "";
    const { top, th, r, w, size } = sideTab(py, ph, rr);
    const x0 = px, x1 = px + w, y1 = top + th, ov = FS * 0.03;
    const onPtrs = [1, 2].filter((n) => brgOn[n]).join();
    const label = (BEARING_STATES.find(([, p]) => p.join() === onPtrs) || ["NONE"])[0];
    const on = onPtrs !== "";
    return `<path d="M${x0 - ov} ${top} L${x1 - r} ${top} A${r} ${r} 0 0 1 ${x1} ${top + r} L${x1} ${y1 - r} A${r} ${r} 0 0 1 ${x1 - r} ${y1} L${x0 - ov} ${y1} Z" fill="${on ? bearingC : "rgba(0,0,0,0.55)"}"/>`
      + `<text x="${(x0 + x1) / 2}" y="${top + th / 2 + size * 0.35}" fill="${on ? darkenToContrast(bearingC) : bearingC}" font-size="${size}" text-anchor="middle">${label}</text>`
      + `<path d="M${x0} ${top} L${x1 - r} ${top} A${r} ${r} 0 0 1 ${x1} ${top + r} L${x1} ${y1 - r} A${r} ${r} 0 0 1 ${x1 - r} ${y1} L${x0} ${y1}" fill="none" stroke="${bearingC}" stroke-width="${stroke}"/>`;
  };
  // Bottom-corner bearing labels -- twin of HSI._bearing_corner_label. Off,
  // they read "1 OFF" / "2 OFF" as the tap target for the BRG state, but
  // only for a pointer that is offered (its source is not the CDI's) and
  // only where no BRG tab carries the state: under `top_panel` the corners
  // stay clear. Font 0.85 fontSize at 3% / 97% of the width; in `split` the
  // baseline rises to clear the CRS/HDG boxes (_bearing_label_baseline).
  const bearingCorners = () => {
    if (layout === "top_panel") return "";
    const fs = FS * 0.85, y = layout === "split" ? 86 : 100 - FS * 0.5;
    return brgOffered.filter((n) => !brgOn[n]).map((n) => n === 1
      ? `<text x="3" y="${y}" fill="${bearingC}" font-size="${fs}">1 OFF</text>`
      : `<text x="97" y="${y}" text-anchor="end" fill="${bearingC}" font-size="${fs}">2 OFF</text>`).join("");
  };

  // Static-element drop shadow (AER-393, lockstep with AER-392's shipped
  // per-layer decision -- pyEfis#144, pyefis.instruments.helpers.SHADOW_*):
  // config-gated, default off. Values mirror the widget 1:1 -- black,
  // alpha 0.6, ZERO offset. The offset is load-bearing, not stylistic: the
  // rose card rotates with heading, and a drop shadow implies a fixed
  // light, so any offset would make the light appear to swing as the card
  // turns (AER-392 gotcha #1, carried over per this issue's "rotation
  // gotcha" section). Blur is keyed to each shadowed element's own size
  // (rose radius / panel height) -- this preview has no live font metrics
  // to key to like the widget's fontSize-based SHADOW_BLUR_RATIO does, so
  // panel/rose height is the twin's nearest equivalent.
  const shadowEnabled = o.shadow_enabled === true;           // default off
  const SHADOW_ALPHA = 0.6;
  const SHADOW_BLUR_RATIO = 0.12;
  const id = _svgUid++;

  // Readout-panel shadow (Option 4 twin of AER-392's bake_blurred_silhouette):
  // a blurred silhouette of the panel's own rect with the panel's own
  // footprint punched back OUT of the blur (feComposite operator="out"
  // against the same rect's SourceAlpha). Without the punch, the halo is a
  // solid filled shape under the whole panel, and blitting that beneath the
  // panel's own translucent fill (rgba(0,0,0,0.62)) tints the entire
  // interior instead of just the edge falloff -- AER-415, the exact bug the
  // widget hit and fixed; this twin reproduces the fix, not the bug.
  // Blur is capped to the panel's own clearance to the viewBox edge so nothing
  // hard-clips there (AER-392 gotcha #2) -- this preview's equivalent of the
  // widget capping to on-screen margin in _readout_shadow_image (the rose,
  // below, resolves the same gotcha the OTHER way the widget does: by
  // shrinking itself to reserve clearance up front, not by capping after).
  const readoutShadow = (x, y, w, h, r) => {
    if (!shadowEnabled) return "";
    const margin = Math.min(y, 100 - (y + h), x, 100 - (x + w));
    const blur = Math.min(h * SHADOW_BLUR_RATIO, Math.max(0, margin) / 3.0);
    if (blur <= 0) return "";
    const fid = `hsiPanelShadow${id}`, pad = blur * 3.0;
    return `<defs><filter id="${fid}" x="${x - pad}" y="${y - pad}" width="${w + 2 * pad}" height="${h + 2 * pad}" filterUnits="userSpaceOnUse">`
      + `<feGaussianBlur in="SourceAlpha" stdDeviation="${blur.toFixed(3)}" result="blurred"/>`
      + `<feFlood flood-color="#000" flood-opacity="${SHADOW_ALPHA}" result="color"/>`
      + `<feComposite in="color" in2="blurred" operator="in" result="shadow"/>`
      + `<feComposite in="shadow" in2="SourceAlpha" operator="out"/>`
      + `</filter></defs>`
      + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#000" filter="url(#${fid})"/>`;
  };

  // --- Arc orientation (P5b.3) -----------------------------------------------
  // Twin of the widget's _paint_arc: the forward +/-60 heading sector spread
  // linearly across the width and bowed into an arc, decluttered of the rear
  // rose. north_up/heading_up/track_up fall through to the full rose below.
  if (o.orientation === "arc") {
    const halfDeg = 60, HALFW = 47, SAG = 16, OWNY = 82;
    // Drop the band below the top-panel/split readouts (gutter = 16 in the
    // 0..100 box), mirroring _arc_params.
    const TOPY = (layout === "top_panel" || layout === "split") ? 20 : 9;
    const tk = 3.4;                                    // arc tick unit
    const relA = (a) => { let d = (((a - heading) % 360) + 360) % 360; if (d > 180) d -= 360; return d; };
    const inSec = (a) => Math.abs(relA(a)) <= halfDeg + 1e-9;
    const band = (a) => { const f = relA(a) / halfDeg; return { x: 50 + f * HALFW, y: TOPY + SAG * f * f }; };
    const afmt = (v) => String((((Math.round(v)) % 360) + 360) % 360).padStart(3, "0") + "°";
    const hStart = Math.round(heading) - halfDeg - 5, hEnd = Math.round(heading) + halfDeg + 5;
    // Ticks (5-deg, weight/length hierarchy), fanned toward ownship.
    let aticks = "";
    for (let dd = hStart; dd <= hEnd; dd += 5) {
      const cnt = ((dd % 360) + 360) % 360;
      if (!inSec(cnt)) continue;
      let len, w;
      if (cnt % 90 === 0) { len = tk * 1.25; w = 0.7; }
      else if (cnt % 30 === 0) { len = tk * 1.15; w = 0.6; }
      else if (cnt % 10 === 0) { len = tk; w = 0.42; }
      else { len = tk * 0.5; w = 0.28; }
      const b = band(cnt), dx = 50 - b.x, dy = OWNY - b.y, dl = Math.hypot(dx, dy) || 1;
      aticks += `<line x1="${b.x}" y1="${b.y}" x2="${b.x + dx / dl * len}" y2="${b.y + dy / dl * len}" stroke="${fg}" stroke-width="${w}"/>`;
    }
    // Numerals upright (30-deg) / cardinal (90-deg), just inside the band.
    const anfs = 3.1 * numScale;
    let anums = "";
    for (let dd = hStart; dd <= hEnd; dd += 5) {
      const cnt = ((dd % 360) + 360) % 360;
      if (cnt % 30 !== 0 || !inSec(cnt)) continue;
      const b = band(cnt), dx = 50 - b.x, dy = OWNY - b.y, dl = Math.hypot(dx, dy) || 1;
      const off = tk * 1.4 + anfs * 0.7, lx = b.x + dx / dl * off, ly = b.y + dy / dl * off;
      anums += `<text x="${lx}" y="${ly + anfs * 0.35}" fill="${fg}" font-size="${anfs}" text-anchor="middle">${headingLabel(cnt)}</text>`;
    }
    // Turn-rate trend along the band (twin of _draw_turn_trend_arc): marks and
    // arc follow the band at (heading + rel), lifted 0.35 fontSize toward the
    // lubber; marks vertical, the standard-rate pair longer. Painted under the
    // lubber, as the widget does.
    let aturn = "";
    if (turnOn) {

// in the TRK box (G11c).
const ND_PANEL = "#000000", ND_PANEL_ALPHA = 200, ND_TRK_FILL = "#000000";
const ND_FAIL = "XXX";

const _ndFmtInt = (v) => String(pyRound(v));
const _ndFmtDeg = (v) => String(((pyRound(v) % 360) + 360) % 360 || 360).padStart(3, "0");

// nd._field: [text, colour], or null when the key is absent.
function ndField(read, key, fmt) {
  const r = read(key);
  if (r == null) return null;
  const [value, old, bad, fail] = r;
  if (fail) return [ND_FAIL, ND_RED];
  const v = pyFloat(value, null);
  if (v === null || !Number.isFinite(v)) return [ND_FAIL, ND_RED];
  return [fmt(v), (old || bad) ? ND_GREY : ND_WHITE];
}

// nd.top_left: GS/TAS, then wind dir/speed, and the wind arrow's
// from-direction or null.
function ndTopLeft(read) {
  const lines = [], speeds = [];
  for (const key of ["GS", "TAS"]) {
    const f = ndField(read, key, _ndFmtInt);
    if (f) speeds.push([key, ND_WHITE], f);
  }
  if (speeds.length) lines.push(speeds);
  const wdir = ndField(read, "WINDDIR", _ndFmtDeg);
  const wspd = ndField(read, "WINDSPD", _ndFmtInt);
  let arrow = null;
  if (wdir && wspd) {
    if (wdir[0] === ND_FAIL || wspd[0] === ND_FAIL) lines.push([[ND_FAIL, ND_RED]]);
    else if (wdir[1] === ND_GREY || wspd[1] === ND_GREY) lines.push([[`${wdir[0]}°/${wspd[0]}`, ND_GREY]]);
    else {
      lines.push([[`${wdir[0]}°/${wspd[0]}`, ND_WHITE]]);
      arrow = pyFloat(read("WINDDIR")[0], null);
    }
  }
  return { lines, arrow };
}

// nd.eta_text: UTC HHMM.Mz at now + WPETE seconds.
function ndEtaText(eteS, now) {
  const t = Math.floor(now + eteS);
  const d = new Date(t * 1000);
  const tenths = Math.trunc((d.getUTCSeconds() / 60) * 10);
  return `${String(d.getUTCHours()).padStart(2, "0")}${String(d.getUTCMinutes()).padStart(2, "0")}.${tenths}z`;
}

// nd.top_right: the active waypoint block (ident, ETA, distance), drawn only
// while FPLSTATE != 0, by the FP7 rules quoted there.
function ndTopRight(read, now) {
  const st = read("FPLSTATE");
  if (st == null || read("WPNAME") == null) return [];
  const state = pyInt(st[0] || 0) ?? 0;
  if (state === 0) return [];
  const stale = !!st[1];
  let ident = read("WPNAME")[0];
  ident = typeof ident === "string" ? ident.trim() : "";
  let lines = [[[ident, ND_MAGENTA]]];
  const ph = read("FPLPHASE");
  const phase = ph != null && typeof ph[0] === "string" ? ph[0].trim() : "";
  if (phase !== "VECTORS") {
    const ete = read("WPETE");
    if (ete != null) {
      if (ete[3]) lines.push([[ND_FAIL, ND_RED]]);
      else if (ete[2]) lines.push([["--:--", ND_GREY]]);
      else {
        const s = pyFloat(ete[0], null);
        lines.push(s === null || !Number.isFinite(s) ? [[ND_FAIL, ND_RED]] : [[ndEtaText(s, now), ND_WHITE]]);
      }
    }
    const dis = ndField(read, "WPDIS", (v) => v < 100 ? pyFixed1(v) : String(pyRound(v)));
    if (dis) lines.push(dis[0] === ND_FAIL ? [dis] : [dis, ["NM", dis[1]]]);
  }
  if (stale) lines = lines.map((line) => line.map(([t]) => [t, ND_GREY]));
  return lines;
}

// nd.bottom_left: the selected map options, cyan (WXR has no layer here).
function ndBottomLeft(enabled) {
  return [["airports", "ARPT"], ["fixes", "WPT"], ["navaids", "STA"]]
    .filter(([id]) => enabled.has(id)).map(([, label]) => [[label, ND_CYAN]]);
}

// The ND's layers that bottom_left lists, enabled as MovingMap.layer_enabled
// reads them: bool(layer_<id>), airports/navaids on and fixes off by default.
function ndEnabledLayers(o) {
  const on = new Set();
  for (const [id, dflt] of [["airports", true], ["navaids", true], ["fixes", false]]) {
    if (pyTruthy(o["layer_" + id], dflt)) on.add(id);
  }
  return on;
}

// nd.vdev: the vertical deviation scale's state, or null when not drawn.
function ndVdev(read) {
  const gsi = read("GSI");
  if (gsi == null) return null;
  const gsv = read("GSV");
  let gsvV = null;
  if (gsv != null) {
    gsvV = pyFloat(gsv[0], null);
    if (gsvV === null) gsvV = 0;
    if (gsvV < 0.5) return null;
  }
  const [value, old, bad, fail] = gsi;
  let pointer = null;
  if (!(old || bad || fail)) {
    // max(-1, min(1, nan)) is 1 in Python: min keeps its first argument.
    const v = pyFloat(value, null);
    if (v !== null) pointer = Number.isNaN(v) ? 1 : Math.max(-1, Math.min(1, v));
  }
  return { pointer, flag: gsvV !== null && !!(bad || fail) };
}

function ndAdvance(text, px, bold) {
  const t = ND_ADV[bold ? 1 : 0], k = ND_KERN[bold ? 1 : 0];
  let w = 0, prev = "";
  for (const ch of String(text)) {
    const c = ch.codePointAt(0);
    const a = (c >= 32 && c <= 126) ? t[c - 32] : (c === 0xb0 ? t[95] : 1229);  // else ~0.6 em
    w += Math.round(a * px / 2048) + (prev ? Math.round((k[prev + ch] || 0) * px / 2048) : 0);
    prev = ch;
  }
  return w;
}
// QFontMetrics ascent / descent: the hhea values (1901 / 483) rounded.
function ndFont(px, bold) {
  px = Math.max(1, Math.trunc(px));
  const ascent = Math.round(1901 * px / 2048), descent = Math.round(483 * px / 2048);
  return { px, bold: !!bold, ascent, descent, height: ascent + descent };
}

// nd.paint as draw ops, in widget px: { mode, w, h, cx, cy, up, track,
// trackOld, read, now, enabled, chip }. cx/cy is ownship; up the bearing at
// the top of the screen (always track-up in ND); chip the status chip's text,
// which the top-left backing panel is sized to. Op shapes follow the oracle's
// recording painter, with the arc kept as an arc.
function ndPaintOps(a) {
  const { w, h, cx, cy, up, read, now } = a;
  const g = ndGeometry(a.mode, w, h);
  const fs = g.fs, r = g.r, half = g.half;
  const lw = Math.max(1.5, w * 0.003);
  const white = { rgb: ND_WHITE, width: lw };
  const ops = [];
  const tick = fs * 0.6, ticks = [], numerals = [];
  for (const b of ndTickBearings(up, half)) {
    const rel = (b - up) * Math.PI / 180;
    const sx = Math.sin(rel), sy = -Math.cos(rel);
    const tl = b % 10 === 0 ? tick : tick * 0.5;
    ticks.push([[cx + r * sx, cy + r * sy], [cx + (r - tl) * sx, cy + (r - tl) * sy]]);
    if (b % 30 === 0) {
      const rr = r - tick - fs * 0.7;
      numerals.push([cx + rr * sx, cy + rr * sy, String(Math.trunc((((b % 360) + 360) % 360) / 10))]);
    }
  }
  ops.push({ op: "path", pen: white, brush: null, arc: { cx, cy, r, half }, ticks });
  const f = ndFont(fs, false);
  for (const [nx, ny, label] of numerals) {
    ops.push({ op: "text_rect", pen: white, rect: { x: nx - fs * 1.5, y: ny - fs * 0.7, w: fs * 3, h: fs * 1.4 },
               text: label, font: f });
  }

  // TRK box at the top centre, the lubber triangle under it.
  const col = a.trackOld ? ND_GREY : ND_WHITE;
  const apexY = cy - r;
  const { box, runs, sp } = ndTrkBox(fs, g.box_h, a.track, cx, apexY);
  const polish = ndPolished(a.mode);
  const pen = { rgb: col, width: lw };
  ops.push({ op: "rect", pen, brush: polish ? ND_TRK_FILL : null, rect: box });
  let tx = box.x + sp;
  for (const [t, px, tw] of runs) {
    ops.push({ op: "text_rect", pen, rect: { x: tx, y: box.y, w: tw, h: box.h }, text: t, font: ndFont(px, true) });
    tx += tw + sp;
  }
  const t = fs * 0.45;
  ops.push({ op: "polygon", pen, brush: col, pts: [[cx, apexY], [cx - t, apexY - t], [cx + t, apexY - t]] });

  // Corner blocks: _draw_lines, left aligned at x or right aligned at right,
  // each on a backing panel (G11c, EXPANDED). The top-left panel also backs
  // the range chip, as one shape with the lines (_backing unites its rects).
  const lh = fs * 1.3, pad = ndPanelPad(fs);
  const space = ndAdvance(" ", fs, false);
  const lineWidth = (line) => {
    const rs = line.filter(([txt]) => txt);
    return rs.reduce((s, [txt]) => s + ndAdvance(txt, fs, false), 0) + space * Math.max(0, rs.length - 1);
  };
  const linesWidth = (lines) => lines.reduce((m, line) => Math.max(m, lineWidth(line)), 0);
  const backing = (rects) => ops.push({ op: "backing", pen: null, brush: ND_PANEL, alpha: ND_PANEL_ALPHA,
                                        radius: fs * 0.25, rects });
  const drawLines = (lines, x, y, right) => {
    for (const line of lines) {
      const rs = line.filter(([txt]) => txt);
      const width = lineWidth(line);
      let x0 = right != null ? right - width : x;
      for (const [txt, c] of rs) {
        ops.push({ op: "text_at", pen: { rgb: c, width: 1 }, pt: [x0, y + f.ascent], text: txt, font: f });
        x0 += ndAdvance(txt, fs, false) + space;
      }
      y += lh;
    }
    return y;
  };
  const top = 4 + ndStatusChipHeight(w) + 2;
  const tl = ndTopLeft(read);
  if (polish) {
    const chipW = ndAdvance(a.chip, Math.max(9, Math.trunc(w * 0.03)), false);
    const tlBottom = top + lh * tl.lines.length + (tl.arrow !== null ? fs * 1.9 : 0);
    const tlW = Math.max(linesWidth(tl.lines), tl.arrow !== null ? fs * 1.9 : 0);
    backing([{ x: 6 - pad, y: 4 - pad * 0.5, w: chipW + 2 * pad, h: top - 4 + pad * 0.5 },
             { x: 6 - pad, y: top - pad, w: tlW + 2 * pad, h: tlBottom - top + 2 * pad }]);
  }
  const y = drawLines(tl.lines, 6, top, null);
  if (tl.arrow !== null) {
    // _wind_arrow: a line through (6 + fs, y + fs), head at the -length end,
    // rotated by arrow + 180 - up (the way the wind blows, on screen).
    const len = fs * 0.9, head = len * 0.4;
    const deg = (tl.arrow + 180 - up) * Math.PI / 180, c = Math.cos(deg), s = Math.sin(deg);
    const at = (px, py) => [6 + fs + px * c - py * s, y + fs + px * s + py * c];
    for (const [p0, p1] of [[[0, len], [0, -len]], [[0, -len], [-head * 0.6, -len + head]], [[0, -len], [head * 0.6, -len + head]]]) {
      ops.push({ op: "line", pen: white, pts: [at(...p0), at(...p1)] });
    }
  }
  const tr = ndTopRight(read, now);
  if (tr.length && polish) {
    const trW = linesWidth(tr);
    backing([{ x: w - 6 - trW - pad, y: top - pad, w: trW + 2 * pad, h: lh * tr.length + 2 * pad }]);
  }
  drawLines(tr, 0, top, w - 6);
  const bl = ndBottomLeft(a.enabled);
  if (bl.length && polish) {
    const blTop = h - 6 - lh * bl.length;
    backing([{ x: 6 - pad, y: blTop - pad, w: linesWidth(bl) + 2 * pad, h: lh * bl.length + 2 * pad }]);
  }
  drawLines(bl, 6, h - 6 - lh * bl.length, null);

  // The vertical deviation scale.
  const vg = ndVdevGeometry(w, h), vs = ndVdev(read);
  if (vs) {
    const { x: x0, y0, half: vh } = vg;
    ops.push({ op: "line", pen: white, pts: [[x0 - fs * 0.6, y0], [x0 + fs * 0.6, y0]] });
    for (const d of [-1, -0.5, 0.5, 1]) {
      const yy = y0 - d * vh;
      ops.push({ op: "line", pen: white, pts: [[x0 - fs * 0.3, yy], [x0 + fs * 0.3, yy]] });
    }
    if (vs.pointer !== null) {
      const py = ndVdevPointerY(vg, vs.pointer), ds = fs * 0.45;
      ops.push({ op: "polygon", pen: { rgb: ND_MAGENTA, width: lw }, brush: null,
                 pts: [[x0, py - ds], [x0 + ds, py], [x0, py + ds], [x0 - ds, py]] });
    }
    if (vs.flag) {
      const bf = ndFont(fs, true), pad = fs * 0.3, tw = ndAdvance("GS", bf.px, true);
      const rect = { x: x0 - tw / 2 - pad, y: y0 - bf.height / 2 - pad, w: tw + 2 * pad, h: bf.height + 2 * pad };
      const rp = { rgb: ND_RED, width: Math.max(2, fs * 0.12) };
      ops.push({ op: "rect", pen: rp, brush: "#000000", rect });
      ops.push({ op: "text_rect", pen: rp, rect, text: "GS", font: bf });
    }
  }
  return ops;
}

function _ndEsc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// The ops as SVG. Qt's default pen is square-capped and bevel-joined; text in
