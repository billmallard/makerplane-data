// a rect is centred both ways (Qt: top + (rect h - font height) / 2 + ascent).
function ndOpsSvg(ops) {
  const FONT = `font-family="DejaVu Sans Condensed, DejaVu Sans, sans-serif"`;
  const stroke = (p) => p ? `stroke="${p.rgb}" stroke-width="${p.width}" stroke-linecap="square" stroke-linejoin="bevel"` : `stroke="none"`;
  const fill = (b) => `fill="${b || "none"}"`;
  const fontAttr = (fo) => `${FONT} font-size="${fo.px}"${fo.bold ? ` font-weight="bold"` : ""}`;
  let out = "";
  for (const op of ops) {
    if (op.op === "path") {
      const { cx, cy, r, half } = op.arc;
      const pt = (deg) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
      let d;
      if (half >= 180) {
        const [x0, y0] = pt(0), [x1, y1] = pt(180);
        d = `M${x0},${y0} A${r},${r} 0 0 0 ${x1},${y1} A${r},${r} 0 0 0 ${x0},${y0}`;
      } else {
        const [x0, y0] = pt(-half), [x1, y1] = pt(half);
        d = `M${x0},${y0} A${r},${r} 0 ${half > 90 ? 1 : 0} 1 ${x1},${y1}`;
      }
      d += op.ticks.map(([p, q]) => ` M${p[0]},${p[1]} L${q[0]},${q[1]}`).join("");
      out += `<path d="${d}" fill="none" ${stroke(op.pen)}/>`;
    } else if (op.op === "text_rect") {
      const R = op.rect, fo = op.font;
      const base = R.y + (R.h - fo.height) / 2 + fo.ascent;
      out += `<text x="${R.x + R.w / 2}" y="${base}" text-anchor="middle" ${fontAttr(fo)} fill="${op.pen.rgb}" style="white-space:pre">${_ndEsc(op.text)}</text>`;
    } else if (op.op === "text_at") {
      out += `<text x="${op.pt[0]}" y="${op.pt[1]}" ${fontAttr(op.font)} fill="${op.pen.rgb}" style="white-space:pre">${_ndEsc(op.text)}</text>`;
    } else if (op.op === "backing") {
      // One path, one fill: where the rects overlap the panel is not darker.
      const d = op.rects.map((R) => {
        const k = Math.min(op.radius, R.w / 2, R.h / 2);
        return `M${R.x + k},${R.y} H${R.x + R.w - k} A${k},${k} 0 0 1 ${R.x + R.w},${R.y + k}`
          + ` V${R.y + R.h - k} A${k},${k} 0 0 1 ${R.x + R.w - k},${R.y + R.h}`
          + ` H${R.x + k} A${k},${k} 0 0 1 ${R.x},${R.y + R.h - k} V${R.y + k} A${k},${k} 0 0 1 ${R.x + k},${R.y} Z`;
      }).join(" ");
      out += `<path d="${d}" fill="${op.brush}" fill-opacity="${(op.alpha / 255).toFixed(4)}" fill-rule="nonzero" stroke="none"/>`;
    } else if (op.op === "rect") {
      const R = op.rect;
      out += `<rect x="${R.x}" y="${R.y}" width="${R.w}" height="${R.h}" ${fill(op.brush)} ${stroke(op.pen)}/>`;
    } else if (op.op === "polygon") {
      out += `<polygon points="${op.pts.map((p) => p.join(",")).join(" ")}" ${fill(op.brush)} ${stroke(op.pen)}/>`;
    } else if (op.op === "line") {
      const [p, q] = op.pts;
      out += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" ${stroke(op.pen)}/>`;
    }
  }
  return out;
}

// Preview FIX values for the ND blocks: the schema's category-3 preview,
// keyed by FIX key, read as good data. A key with no preview value reads as
// absent and its block is left out, as on a gateway that does not define it.
function ndPreviewRead(preview) {
  const pv = preview || {};
  return (key) => Object.prototype.hasOwnProperty.call(pv, key) ? [pv[key], false, false, false] : null;
}

// The map widget's size in device pixels: its share of the 110x200 grid on
// the target screen. The device scales stroke, label and chip sizes off it.
function mapDevicePx(inst) {
  return {
    w: Math.max(1, (inst.span?.columns ?? 1) / state.layout.columns * state.screen.width),
    h: Math.max(1, (inst.span?.rows ?? 1) / state.layout.rows * state.screen.height),
  };
}

// map_style picks the palette like pyEfis map_layers.map_style():
// stripped + lower-cased, anything unknown is "standard". The nav_only
// colours are NAV_ONLY_PALETTE's background / range_ring / range_ring_label.
// Standard leaves ring/ringLabel null: there range_ring_color and
// range_ring_opacity style the rings (RangeRingsLayer.colors), while any
// other style's palette owns its ring colours.
function movingMapPalette(o) {
  const style = String((o && o.map_style) || "standard").trim().toLowerCase();
  if (style === "nav_only") {
    return { background: "#000000", ring: "rgb(120,120,120)", ringLabel: "rgb(170,170,170)" };
  }
  return { background: "#101820", ring: null, ringLabel: null };
}

// Moving map twin: a port of MovingMap.paintEvent's no-data frame in device
// pixels -- dark ground, the range-ring layer (rangeRingGeom), the top-down
// ownship at the configurable anchor, with nd_mode the ND overlay
// (ndPaintOps: compass arc or rose, TRK box, option list; ownship and range
// follow the ND), the status chip and, with zoom_rail, the zoom rail at rest
// (zoomRailGeom). Terrain/airport
// layers draw on-device from local data; the twin mirrors the no-data
// presentation (fidelity, not decoration). Text tops follow Qt's AlignTop:
// baseline = rect top + the DejaVu ascent (0.928 em).
function buildMovingMap(inst) {
  const o = inst.options || {};
  const { w, h } = mapDevicePx(inst);
  const g = rangeRingGeom(o, w, h);
  const ASC = 0.928, FONT = `font-family="DejaVu Sans Condensed, DejaVu Sans, sans-serif"`;
  const sym = o.symbol_color || "#ffff00";
  const nd = ndMode(o);
  // The ND is track-up whatever orientation says (view_orientation).
  const mode = (nd === "off" && o.orientation === "north_up") ? "NORTH UP" : "TRK UP";
  const pal = movingMapPalette(o);
  let ringsSvg = "";
  if (o.layer_range_rings !== false) {
    // Standard: the configured colour at the configured opacity, ring and
    // label alike. Any other style: the palette's opaque ring / label colours.
    const op = pal.ring == null ? (g.alpha / 255).toFixed(4) : "1.0000";
    const ringC = pal.ring ?? g.color, labelC = pal.ringLabel ?? g.color;
    for (const ring of g.rings) {
      ringsSvg += `<circle cx="${g.cx}" cy="${g.cy}" r="${ring.r}" fill="none"
        stroke="${ringC}" stroke-opacity="${op}" stroke-width="${g.strokeW}"/>`;
      if (g.labels && !ring.keptOut) {
        const L = ring.label;   // drawText clips to the label rect
        ringsSvg += `<svg x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}" overflow="hidden">
          <text x="0" y="${g.labelPx * ASC}" ${FONT} font-size="${g.labelPx}"
          fill="${labelC}" fill-opacity="${op}">${ring.text}</text></svg>`;
      }
    }
  }
  const s = Math.max(8, w * 0.025);
  const chipPx = Math.max(9, Math.trunc(w * 0.03));
  const rail = zoomRailSvg(zoomRailGeom(o, w, h, displayPxPerMm(state.screen), g.range));
  const chip = `${formatRangeNm(g.range)} NM  ${mode}`;
  // ND overlay (map/nd.py paint), over the layers and ownship, under the chip.
  // The frame's pose is the twin's: track 000, position good.
  let ndSvg = "";
  if (nd !== "off") {
    const meta = (state.schema && state.schema.instruments && state.schema.instruments[inst.type]) || {};
    ndSvg = ndOpsSvg(ndPaintOps({
      mode: nd, w, h, cx: g.cx, cy: g.cy, up: 0, track: 0, trackOld: false,
      read: ndPreviewRead(meta.preview), now: Date.now() / 1000, enabled: ndEnabledLayers(o), chip }));
  }
  return svgFromString(`
<svg viewBox="0 0 ${w} ${h}" class="gauge-svg">
  <rect x="0" y="0" width="${w}" height="${h}" fill="${pal.background}"/>
  ${ringsSvg}
  <polygon points="${g.cx},${g.cy - s} ${g.cx + s * 0.6},${g.cy + s * 0.8} ${g.cx},${g.cy + s * 0.35} ${g.cx - s * 0.6},${g.cy + s * 0.8}"
    fill="${sym}" stroke="#000" stroke-width="1"/>${ndSvg}
  <text x="6" y="${4 + chipPx * ASC}" ${FONT} font-size="${chipPx}" style="white-space:pre"
    fill="rgba(255,255,255,0.784)">${chip}</text>
  ${rail}
</svg>`);
}

function buildVirtualVfr(inst) {
  const o = inst.options || {};
  const scene = ["mountains", "approach", "coastal", "final"].includes(o.preview_scene) ? o.preview_scene : "mountains";
  const wrap = document.createElement("div");
  wrap.className = "gauge svsimg";
  const r = rect(inst);
  const patch = _svsPatchFor(scene);
  if (patch.data) {
    // Background: REAL terrain rendered from the scene's data patch, live to
    // the SVS options (palette, clearance bands, haze, grid, texture, range,
    // horizon position, FOV). Re-rendered on every option change.
    const cv = document.createElement("canvas");
    cv.width = Math.max(64, Math.round(r.w * 2));    // 2x for crispness
    cv.height = Math.max(36, Math.round(r.h * 2));
    cv.style.position = "absolute";
    cv.style.inset = "0";
    cv.style.width = "100%";
    cv.style.height = "100%";
    renderSVS(cv, patch.data, o);
    wrap.appendChild(cv);
  } else {
    // Fallback while the patch loads (or if it failed): the captured clean
    // GL frame. Horizon sits at the frame centre; approximate
    // horizon_position by shifting + covering scale until the canvas lands.
    const img = document.createElement("img");
    img.src = `${ASSETS}/svs/${scene}.webp`;
    img.alt = "synthetic vision — " + scene;
    img.draggable = false;
    img.onerror = () => img.remove();
    const hpRaw = Number(o.horizon_position);
    const hpf = (o.horizon_position == null || o.horizon_position === ""
                 || !isFinite(hpRaw)) ? 0 : (hpRaw / 100 - 0.5);
    if (hpf !== 0) {
      img.style.transform =
        `translateY(${(-hpf * 100).toFixed(1)}%) scale(${(1 + 2 * Math.abs(hpf)).toFixed(3)})`;
    }
    wrap.appendChild(img);
  }
  // Overlay: the SAME attitude symbology the device draws over SVS, rendered
  // LIVE from the user's options (aircraft symbol, pitch ladder, bank scale,
  // FPM, heading marks). Drawn at level (pitch 0 / roll 0) so it aligns with the
  // level terrain; transparent background so the terrain shows through.
  const ov = svgFromString(attitudeSVG(inst, 0, 0, 0, false, r.w / r.h,
    mapDevicePx(inst).h));
  ov.style.position = "absolute";
  ov.style.left = "0";
  ov.style.top = "0";
  ov.style.width = "100%";
  ov.style.height = "100%";
  wrap.appendChild(ov);
  return wrap;
}

// Standard "basic-T" arrangement (grid units): attitude centre, airspeed left,
// altimeter right, HSI below, heading top. A starting template + a guide.
const BASIC_T = [
  { type: "atitude_indicator", row: 6, column: 68, span: { rows: 64, columns: 64 } },
  { type: "airspeed_tape", row: 10, column: 6, span: { rows: 56, columns: 16 } },
  { type: "altimeter_tape", row: 10, column: 178, span: { rows: 56, columns: 16 } },
  { type: "horizontal_situation_indicator", row: 72, column: 74, span: { rows: 34, columns: 52 } },
  { type: "heading_display", row: 0, column: 92, span: { rows: 6, columns: 16 } },
];

// --- composition guides (static overlay) ------------------------------------
function guideBox(parent, lf, tf, wf, hf, label) {
  const b = document.createElement("div"); b.className = "guide-box";
  b.style.left = (lf * 100) + "%"; b.style.top = (tf * 100) + "%";
  b.style.width = (wf * 100) + "%"; b.style.height = (hf * 100) + "%";
  if (label) { const s = document.createElement("span"); s.className = "guide-label"; s.textContent = label; b.appendChild(s); }
  parent.appendChild(b);
}

function renderGuides() {
  const g = $("guides"); g.innerHTML = "";
  const m = state.guides, V = [], H = [];
  if (m === "center") { V.push(0.5); H.push(0.5); }
  else if (m === "thirds") { V.push(1 / 3, 2 / 3); H.push(1 / 3, 2 / 3); }
  else if (m === "golden") { V.push(0.382, 0.618); H.push(0.382, 0.618); }
  else if (m === "basic-t") {
    for (const t of BASIC_T) {
      guideBox(g, t.column / state.layout.columns, t.row / state.layout.rows,
               t.span.columns / state.layout.columns, t.span.rows / state.layout.rows);
    }
  } else if (m === "pfd-ems") {
    // Primary flight (attitude/airspeed/altitude) in the top-left two-thirds;
    // engine/aux in the right third and the bottom third.
    guideBox(g, 0, 0, 2 / 3, 2 / 3, "Primary (PFD)");
    guideBox(g, 2 / 3, 0, 1 / 3, 1, "EMS / aux");
    guideBox(g, 0, 2 / 3, 2 / 3, 1 / 3, "EMS / aux");
  }
  for (const f of V) { const d = document.createElement("div"); d.className = "guide-v"; d.style.left = (f * 100) + "%"; g.appendChild(d); }
  for (const f of H) { const d = document.createElement("div"); d.className = "guide-h"; d.style.top = (f * 100) + "%"; g.appendChild(d); }
}

// --- smart alignment (snap-to-object/guide while dragging) -------------------
function alignTargets() {
  const cols = state.layout.columns, rows = state.layout.rows;
  const V = [0, cols / 2, cols], H = [0, rows / 2, rows];   // canvas edges + centre
  const m = state.guides;
  if (m === "thirds") { V.push(cols / 3, 2 * cols / 3); H.push(rows / 3, 2 * rows / 3); }
  else if (m === "golden") { V.push(cols * 0.382, cols * 0.618); H.push(rows * 0.382, rows * 0.618); }
  else if (m === "basic-t") {
    for (const t of BASIC_T) {
      V.push(t.column, t.column + t.span.columns / 2, t.column + t.span.columns);
      H.push(t.row, t.row + t.span.rows / 2, t.row + t.span.rows);
    }
  } else if (m === "pfd-ems") { V.push(cols * 2 / 3); H.push(rows * 2 / 3); }
  state.instruments.forEach((o, idx) => {
    if (idx === state.selected) return;
    V.push(o.column, o.column + o.span.columns / 2, o.column + o.span.columns);
    H.push(o.row, o.row + o.span.rows / 2, o.row + o.span.rows);
  });
  return { V, H };
}

function snapAlign(inst, col, row, gw, gh) {
  const tolC = 6 / gw, tolR = 6 / gh;
  const { V, H } = alignTargets();
  let outCol = col, outRow = row, vg = null, hg = null, bestC = tolC, bestR = tolR;
  const anchorsC = [[col, 0], [col + inst.span.columns / 2, inst.span.columns / 2], [col + inst.span.columns, inst.span.columns]];
  for (const line of V) for (const [a, off] of anchorsC) {
    const d = Math.abs(a - line);
    if (d <= bestC) { bestC = d; outCol = line - off; vg = line; }
  }
  const anchorsR = [[row, 0], [row + inst.span.rows / 2, inst.span.rows / 2], [row + inst.span.rows, inst.span.rows]];
  for (const line of H) for (const [a, off] of anchorsR) {
    const d = Math.abs(a - line);
    if (d <= bestR) { bestR = d; outRow = line - off; hg = line; }
  }
  return { col: outCol, row: outRow, vg, hg };
}

function drawAlign(vg, hg) {
  const a = $("align"); a.innerHTML = "";
  if (vg != null) { const d = document.createElement("div"); d.className = "align-v"; d.style.left = (vg / state.layout.columns * 100) + "%"; a.appendChild(d); }
  if (hg != null) { const d = document.createElement("div"); d.className = "align-h"; d.style.top = (hg / state.layout.rows * 100) + "%"; a.appendChild(d); }
}
function clearAlign() { $("align").innerHTML = ""; }

// Common Pi-panel resolutions + sizes (the canvas adopts the chosen aspect;
// pyEfis maps the 200x110 grid onto the real screen, so aspect is what drives
// the visual layout -- absolute pixels are normalised away).
const RESOLUTIONS = [
  { w: 800, h: 480 }, { w: 1024, h: 600 }, { w: 1280, h: 800 }, { w: 1280, h: 1024 },
  { w: 1920, h: 1080 }, { w: 1920, h: 1200 },
];
// Panel sizes, keyed on the TRUE viewable diagonal -- that is what the DPI
// maths needs, and what pyEfis stores as `screenDiagonalInches`.
//
// Monitors are sold by a rounded class that is usually LARGER than the panel:
// a "22-inch" monitor is a 21.5-inch panel, a "24-inch" is 23.8. A builder
// looking for the number printed on the box could not find it here and
// reasonably concluded the list was wrong, so `cls` puts that number in the
// label while the stored value stays the real one. Anything not listed goes
// through Custom, like the resolution control above.
const INCHES = [
  { in: 5 }, { in: 7 }, { in: 8 }, { in: 10.1 }, { in: 11.6 },
  { in: 15.6 }, { in: 21.5, cls: 22 }, { in: 23.8, cls: 24 }, { in: 27 },
];
const inchLabel = (e) => e.cls ? `${e.in}″ (${e.cls}″ class)` : `${e.in}″`;

function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function aspect(w, h) { const g = gcd(w, h), aw = w / g, ah = h / g; return ah <= 20 ? `${aw}:${ah}` : `${(w / h).toFixed(2)}:1`; }
function dpi() { return state.screen.inches ? Math.round(Math.hypot(state.screen.width, state.screen.height) / state.screen.inches) : null; }

function buildThemeControl() {
  const sel = $("theme-sel");
  sel.innerHTML = "";
  for (const t of PANEL_THEMES) {
    const o = document.createElement("option"); o.value = t.id; o.textContent = t.label; sel.appendChild(o);
  }
  sel.value = state.theme;
  sel.addEventListener("change", () => { state.theme = sel.value; renderCanvas(); renderProps(); });
}

function buildScreenControls() {
  const res = $("res");
  res.innerHTML = "";
  for (const r of RESOLUTIONS) {
    const o = document.createElement("option");
    o.value = r.w + "x" + r.h; o.textContent = r.w + " × " + r.h;
    res.appendChild(o);
  }
  const custom = document.createElement("option"); custom.value = "custom"; custom.textContent = "Custom…"; res.appendChild(custom);
  const inch = $("inches");
  inch.innerHTML = "";
  const none = document.createElement("option"); none.value = ""; none.textContent = "— in"; inch.appendChild(none);
  for (const e of INCHES) {
    const o = document.createElement("option");
    o.value = e.in; o.textContent = inchLabel(e); inch.appendChild(o);
  }
  const inchCustom = document.createElement("option");
  inchCustom.value = "custom"; inchCustom.textContent = "Custom…"; inch.appendChild(inchCustom);
  res.addEventListener("change", onResChange);
  inch.addEventListener("change", () => {
    if ($("inches").value === "custom") {
      $("inches-custom").classList.remove("hidden");
      $("ci").value = state.screen.inches || "";
      $("ci").focus();
      return;                       // wait for a number before touching state
    }
    $("inches-custom").classList.add("hidden");
    state.screen.inches = parseFloat($("inches").value) || null;
    applyScreen();
  });
  $("ci").addEventListener("input", () => {
    const v = parseFloat($("ci").value);
    // Guard the divisor: `inches` feeds dpi() and pyEfis's mm-to-pixel maths,
    // so a zero or a stray minus must not reach it.
    state.screen.inches = (v > 0 && v <= 120) ? v : null;
    applyScreen();
  });
  $("cw").addEventListener("input", onCustom);
  $("ch").addEventListener("input", onCustom);
  syncScreenControls();
}

function onResChange() {
  const v = $("res").value;
  if (v === "custom") { $("custom").classList.remove("hidden"); $("cw").value = state.screen.width; $("ch").value = state.screen.height; return; }
  $("custom").classList.add("hidden");
  const [w, h] = v.split("x").map(Number);
  state.screen.width = w; state.screen.height = h; applyScreen();
}
function onCustom() {
  const w = parseInt($("cw").value, 10), h = parseInt($("ch").value, 10);
  if (w > 0 && h > 0) { state.screen.width = w; state.screen.height = h; applyScreen(); }
}
function syncScreenControls() {
  const key = state.screen.width + "x" + state.screen.height;
  if ([...$("res").options].some((o) => o.value === key)) { $("res").value = key; $("custom").classList.add("hidden"); }
  else { $("res").value = "custom"; $("custom").classList.remove("hidden"); $("cw").value = state.screen.width; $("ch").value = state.screen.height; }
  const inches = state.screen.inches;
  if (inches && !INCHES.some((e) => e.in === inches)) {
    $("inches").value = "custom";
    $("inches-custom").classList.remove("hidden");
    $("ci").value = inches;
  } else {
    $("inches").value = inches || "";
    $("inches-custom").classList.add("hidden");
  }
}
function applyScreen() { sizeCanvas(); renderCanvas(); renderProps(); updateReadout(); }
function updateReadout() {
  const d = dpi();
  $("readout").textContent =
    `${state.screen.width}×${state.screen.height} · ${aspect(state.screen.width, state.screen.height)}`
    + (d ? ` · ${state.screen.inches}″ · ${d} DPI` : "");
}

// --- grid <-> pixel math (port of screenbuilder_layout, ratio=false) --------
// `renderSpace`, when set, is the coordinate frame the CURRENT synchronous
// render pass is using -- {gw, gh} cell size in px. cell()/rect() read it
// implicitly so every build*() that calls rect(inst) with no extra argument
// (there are ~15 of them, sizing their own internal geometry, not just their
// wrapper) picks up a nested frame for free when renderContainerTwin() wraps
// a tab's contents in withSpace(). It always resolves back to the root canvas
// frame between render passes (try/finally), so canvas-level interaction code
// (drag/drop hit-testing, outside any render pass) is unaffected and keeps
// calling cell()/rect() exactly as before -- AER-345 (tab_section Phase B).
let renderSpace = null;
function rootSpace() { return { gw: state.canvasW / state.layout.columns, gh: state.canvasH / state.layout.rows }; }
function cell() { return renderSpace || rootSpace(); }
function withSpace(space, fn) {
  const prev = renderSpace;
  renderSpace = space;
  try { fn(); } finally { renderSpace = prev; }
}
// `space`, when passed explicitly, overrides the ambient frame -- used by the
// nested move/resize handlers, which run from mouse events well after the
// render pass that captured their space has finished (renderSpace is back to
// root by then).
function rect(inst, space) {
  const { gw, gh } = space || cell();
  return {
    x: gw * inst.column, y: gh * inst.row,
    w: gw * (inst.span?.columns ?? 1), h: gh * (inst.span?.rows ?? 1),
  };
}

// --- palette ----------------------------------------------------------------
function renderPalette() {
  const pal = $("palette");
  pal.innerHTML = "";

  if (state.groups.length) {
    const h = document.createElement("h3"); h.textContent = "groups"; pal.appendChild(h);
    for (const g of state.groups) {
      const item = document.createElement("div"); item.className = "pal-item"; item.draggable = true;
      item.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", "group:" + g.id));
      const box = document.createElement("div"); box.className = "pal-group";
      for (const ch of g.instruments) {
        const ci = document.createElement("img"); ci.src = `${ASSETS}/palette/${ch.type}.svg`;
        ci.style.left = (ch.column / g.grid.columns * 100) + "%"; ci.style.top = (ch.row / g.grid.rows * 100) + "%";
        ci.style.width = (ch.span.columns / g.grid.columns * 100) + "%"; ci.style.height = (ch.span.rows / g.grid.rows * 100) + "%";
        box.appendChild(ci);
      }
      const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = g.label;
      item.append(box, lbl); pal.appendChild(item);
    }
  }

  const byCat = {};
  for (const [type, meta] of Object.entries(state.schema.instruments)) {
    if (meta.hidden) continue;  // system-managed (e.g. the data-management boot screen)
    (byCat[meta.category] ||= []).push([type, meta]);
  }
  for (const cat of Object.keys(byCat).sort()) {
    const h = document.createElement("h3"); h.textContent = cat; pal.appendChild(h);
    for (const [type, meta] of byCat[cat].sort((a, b) => a[1].label.localeCompare(b[1].label))) {
      const item = document.createElement("div");
      item.className = "pal-item";
      item.draggable = true;
      item.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", type));
      const img = document.createElement("img");
      img.src = `${ASSETS}/palette/${type}.svg`; img.alt = type;
      const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = meta.label;
      item.append(img, lbl);
      pal.appendChild(item);
    }
  }
}

// --- canvas -----------------------------------------------------------------
function sizeCanvas() {
  // Canvas adopts the TARGET screen's aspect ratio (the 200x110 grid maps onto
  // it), scaled to fit the available editor area.
  const c = $("canvas");
  const stage = c.parentElement;
  const availW = stage.clientWidth - 36;
  const availH = stage.clientHeight - 36;
  const ar = state.screen.width / state.screen.height;
  let w = Math.min(availW, 1400), h = w / ar;
  if (h > availH) { h = availH; w = h * ar; }
  state.canvasW = Math.round(w);
  state.canvasH = Math.round(h);
  c.style.width = state.canvasW + "px";
  c.style.height = state.canvasH + "px";
  const cw = state.canvasW / state.layout.columns, ch = state.canvasH / state.layout.rows;
  c.style.setProperty("--cw", cw + "px");
  c.style.setProperty("--ch", ch + "px");
  c.style.setProperty("--cw10", cw * 10 + "px");
  c.style.setProperty("--ch10", ch * 10 + "px");
}

// Live twin for the Button (soft-controls). Renders the static styled button
// (text / colours / two-line label); condition-driven appearance is a later
// phase. Fidelity: match the pyEfis QPushButton -- fill = bg_color (none when
// transparent), label = fg_color, centred, DejaVu Sans Condensed, \n -> lines.
function buildButton(inst) {
  const o = inst.options || {};
  const el = document.createElement("div");
  el.className = "inst-button";
  el.style.cssText = "width:100%;height:100%;box-sizing:border-box;display:flex;"
    + "align-items:center;justify-content:center;text-align:center;overflow:hidden;"
    + "white-space:pre-line;line-height:1.1;border-radius:3px;"
    + 'font-family:"DejaVu Sans Condensed";';
  const transparent = o.transparent === true || o.transparent === "true";
  el.style.background = transparent ? "transparent" : (o.bg_color || "#101418");
  el.style.color = o.fg_color || "#00ffff";
  el.style.border = transparent ? "1px dashed rgba(255,255,255,0.2)"
                                : "1px solid rgba(255,255,255,0.28)";
  const txt = (o.text != null && o.text !== "" ? String(o.text) : "Button")
                .replace(/\\n/g, "\n");
  const lines = Math.max(1, txt.split("\n").length);
  // Font size multiplies the label size (button/__init__.py setStyle, pyEfis
  // #229). The device's font_mask clamp (multiplier <= 1) isn't modelled: the
  // inline Button never reads font_mask from its config, so the clamp branch
  // is unreachable from a configurator design.
  const scale = fontScale(o.font_percent);
  el.style.fontSize = Math.max(8, (0.45 / lines) * rect(inst).h * scale) + "px";
  el.textContent = txt;
  return el;
}

// Allocate an unused touchscreen-button FIX key (TSBTN{id}<n>, n in 1..40 per
// fix-gateway variables.yaml) among the design's own buttons. Cross-device
// collision avoidance (stock + injected switch buttons) is Phase C hardening
// (makerplane-data/docs/soft_controls_configurator.md).
function allocateTsbtn() {
  const used = new Set();
  for (const it of state.instruments) {
    if (it.type === "button" && it.options && it.options.dbkey) {
      const m = /TSBTN\{id\}(\d+)/.exec(it.options.dbkey);
      if (m) used.add(Number(m[1]));
    }
  }
  for (let n = 1; n <= 40; n++) if (!used.has(n)) return "TSBTN{id}" + n;
  return "TSBTN{id}40";
}

function renderCanvas() {
  const c = $("canvas");
  c.querySelectorAll(".inst").forEach((e) => e.remove());
  state.instruments.forEach((inst, i) => {
    const meta = state.schema.instruments[inst.type] || {};
    const el = document.createElement("div");
    el.className = "inst" + (meta.offscreen_renderable ? "" : " placeholder") + (meta.keep_aspect ? " lock" : "");
    if (i === state.selected) el.classList.add("sel");   // container stays highlighted even with a nested child also selected
    el.dataset.i = i;
    positionEl(el, inst);
    buildInstrumentTwin(el, inst, meta, i, 0);
    const handle = document.createElement("div"); handle.className = "handle";
    el.appendChild(handle);
    el.addEventListener("mousedown", (e) => startMove(e, i, el));
    handle.addEventListener("mousedown", (e) => startResize(e, i, el));
    c.appendChild(el);
  });
  renderCasWarning();
  syncCode();
}

// Build one instrument's twin content into `el` -- the same per-type dispatch
// for a top-level canvas instrument (ci = its index, depth 0) and a
// tab_section's nested content (ci = the CONTAINING top-level container's
// index, depth 1), so a nested instrument gets the exact fidelity a
// top-level one has (AER-345 sec 4f). `ci`/`depth` are only consulted by the
// container branch below; depth caps recursion at 1 (see there).
// Editor chrome over a gauge's twin, never part of it: red when its tank is
// gone from the profile (the twin itself draws the device's failed look), a
// dashed outline while a migration is previewed, and, on the selected gauge
// when it is bound to a tank, the note that its bands are the device's.
function markTankBinding(el, stored) {
  const pv = state.migrationPreview;
  if (pv && pv.inst === stored) el.classList.add("migrating");
  const b = tankBinding(pv && pv.inst === stored ? { ...stored, options: migratedOptions(stored.options, pv.id) } : stored);
  if (!b || !state.aircraftRefs) return;
  if (b.orphan) {
    el.classList.add("orphan");
    el.title = `${b.label ? '"' + b.label + '"' : "This gauge"}: its tank is no longer on the aircraft page. `
      + "The device draws it failed (xxx) until it is bound again.";
  } else if (!profileBandsOnDevice() && el.classList.contains("sel")) {
    const note = document.createElement("div");
    note.className = "inst-note";
    note.textContent = "bands from the device's fix-gateway";
    el.appendChild(note);
  }
}

function buildInstrumentTwin(el, inst, meta, ci, depth) {
  // Draw what the device draws: colour tokens resolved through the active panel
  // theme. A container keeps the real record (its twin writes activeTab) and
  // resolves its own colours.
  const stored = inst;
  if (!(depth === 0 && meta.containers && meta.containers.length)) inst = themedInstrument(refResolved(inst));
  if (inst.type === "group") {
      el.classList.add("group");
      const def = state.groupsById[inst.id];
      if (def) for (const ch of def.instruments) {
        const gi = document.createElement("img"); gi.className = "gchild";
        gi.src = `${ASSETS}/palette/${ch.type}.svg`;
        gi.style.left = (ch.column / def.grid.columns * 100) + "%"; gi.style.top = (ch.row / def.grid.rows * 100) + "%";
        gi.style.width = (ch.span.columns / def.grid.columns * 100) + "%"; gi.style.height = (ch.span.rows / def.grid.rows * 100) + "%";
        el.appendChild(gi);
      }
    } else if (inst.type === "atitude_indicator") {
      el.appendChild(buildAttitude(inst));
    } else if (inst.type === "moving_map") {
      el.appendChild(buildMovingMap(inst));
    } else if (inst.type === "virtual_vfr") {
      el.appendChild(buildVirtualVfr(inst));
    } else if (inst.type === "airspeed_tape" || inst.type === "altimeter_tape") {
      el.appendChild(buildTape(inst));
    } else if (inst.type === "heading_tape") {
      el.appendChild(buildHeadingTape(inst));
    } else if (inst.type === "horizontal_situation_indicator") {
      el.appendChild(buildHSI(inst));
    } else if (inst.type === "airspeed_dial") {
      el.appendChild(buildAirspeedDial(inst));
    } else if (inst.type === "altimeter_dial") {
      el.appendChild(buildAltimeterDial(inst));
    } else if (inst.type === "vsi_dial") {
      el.appendChild(buildVsiDial(inst));
    } else if (inst.type === "turn_coordinator") {
      el.appendChild(buildTurnCoordinator(inst));
    } else if (inst.type === "altimeter_trend_tape") {
      el.appendChild(buildTrendTape(inst));
    } else if (inst.type === "vsi_pfd") {
      el.appendChild(buildVsiPfd(inst));
    } else if (inst.type === "wind_display") {
      el.appendChild(buildWind(inst));
    } else if (inst.type === "airspeed_trend_tape") {
      el.appendChild(buildAirspeedTrend(inst));
    } else if (inst.type === "airspeed_box") {
      el.appendChild(buildAirspeedBox(inst));
    } else if (inst.type === "data_annunciation") {
      el.appendChild(buildDataAnnunciation(inst));
    } else if (inst.type === "autopilot_panel") {
      el.appendChild(buildAutopilotPanel(inst));
    } else if (inst.type === "ap_annunciator") {
      el.appendChild(buildApAnnunciator(inst));
    } else if (inst.type === "annunciator") {
      el.appendChild(buildAnnunciator(inst));
    } else if (inst.type === "button") {
      el.classList.remove("placeholder");   // has a real twin, not a placeholder
      el.appendChild(buildButton(inst));
    } else if (LIVE_GAUGE.has(inst.type)) {
      el.appendChild(inst.type === "arc_gauge"
        ? buildArcGauge(inst)
        : buildBarGauge(inst, inst.type === "vertical_bar_gauge"));
      markTankBinding(el, stored);
    } else if (LIVE_TEXT.has(inst.type)) {
      const o = inst.options;
      const def = TEXT_DEFAULTS[inst.type] || { font: "DejaVu Sans Condensed", pct: 0.5 };
      const content = document.createElement("div");
      content.className = "inst-text";
      content.style.fontFamily = '"' + (o.font_family || def.font) + '"';
      const schemaDefault = (name) => meta.options?.[name]?.default;
      const fg = o.fg_color || schemaDefault("fg_color");
      if (fg) content.style.color = fg;
      // Background fill honours bg_opacity (heading_display): 0 = transparent so
      // the screen behind shows through, like the widget. The fg-coloured frame
      // stays for legibility, matching HeadingDisplay's drawRect outline.
      const bgc = o.bg_color || schemaDefault("bg_color");
      if (bgc) content.style.background =
        rgbaFromColor(bgc, bgOpacity(o));
      if (def.bold) content.style.fontWeight = "bold";
      if (def.framed) {
        content.style.boxSizing = "border-box";
        content.style.border = "1px solid " + (fg || "currentColor");
      }
      // font_percent: whole-number percent (40) or legacy fraction (0.40).
      const _vh = rect(inst).h;
      let _fp = o.font_percent != null ? Number(o.font_percent) : def.pct;
      if (_fp > 1) _fp = _fp / 100;
      content.style.fontSize = Math.max(8, _fp * _vh) + "px";
      content.style.justifyContent = textJustify(inst);
      // value_text: optional box (border + background) on the widget bounds.
      // bg_opacity defaults to 0 (transparent), matching misc.ValueDisplay.
      if (inst.type === "value_text") {
        const _bgo = o.bg_opacity != null ? Math.max(0, Math.min(1, Number(o.bg_opacity) / 100)) : 0;
        content.style.background = o.bg_color ? rgbaFromColor(o.bg_color, _bgo) : "transparent";
        const _bw = Number(o.border_width) || 0;
        if (_bw > 0) {
          content.style.boxSizing = "border-box";
          const _bo = o.border_opacity != null ? Math.max(0, Math.min(1, Number(o.border_opacity) / 100)) : 1;
          content.style.border = _bw + "px solid " + rgbaFromColor(o.border_color || "#ffffff", _bo);
        } else {
          content.style.border = "none";
        }
      }
      // value_text: optional prefix label (own font/size/colour) drawn before
      // the value, plus a configurable value colour -- matches misc.ValueDisplay.
      if (inst.type === "value_text" && o.prefix_text) {
        content.style.alignItems = "baseline";
        const pre = document.createElement("span");
        pre.textContent = o.prefix_text;
        pre.style.fontFamily = '"' + (o.prefix_font_family || o.font_family || def.font) + '"';
        pre.style.color = o.prefix_color || "#ffffff";
        let _pfp = o.prefix_font_percent != null ? Number(o.prefix_font_percent) : 50;
        if (_pfp > 1) _pfp = _pfp / 100;
        pre.style.fontSize = Math.max(6, _pfp * _vh) + "px";
        pre.style.marginRight = "0.3em";
        content.appendChild(pre);
        const valSpan = document.createElement("span");
        valSpan.textContent = sampleText(inst);
        if (o.value_color) valSpan.style.color = o.value_color;
        content.appendChild(valSpan);
      } else {
        content.textContent = sampleText(inst);
        if (inst.type === "value_text" && o.value_color) content.style.color = o.value_color;
        // numeric_display show_units: the unit in the small font (0.4 of the
        // value font, NumericDisplay.small_font_percent), right-aligned.
        if (inst.type === "numeric_display" && o.pressure === true && o.show_units) {
          const u = document.createElement("span");
          u.textContent = state.baroUnit;
          u.style.fontSize = "0.4em";
          u.style.marginLeft = "auto";
          u.style.alignSelf = "flex-start";
          content.appendChild(u);
        }
      }
      el.appendChild(content);
    } else if (depth === 0 && meta.containers && meta.containers.length) {
      // Depth-capped: a container only recurses one level, enforcing "no
      // tab_section inside a tab_section" (sec 3/sec 7 Q1) at render time even
      // though a hand-edited YAML could technically nest one. A nested
      // container at depth 1 falls through to the flat placeholder below
      // instead, matching Phase A's original treatment of every container.
      el.appendChild(buildContainerTwin(inst, meta, ci));
    } else {
      const content = document.createElement("img");
      content.src = `${ASSETS}/palette/${inst.type}.svg`; content.alt = inst.type;
      el.appendChild(content);
    }
}

function positionEl(el, inst, space) {
  const r = rect(inst, space);
  el.style.left = r.x + "px"; el.style.top = r.y + "px";
  el.style.width = r.w + "px"; el.style.height = r.h + "px";
}

// --- drag from palette ------------------------------------------------------
const canvas = $("canvas");
canvas.addEventListener("dragover", (e) => { e.preventDefault(); canvas.classList.add("dragover"); });
canvas.addEventListener("dragleave", () => canvas.classList.remove("dragover"));

// Build the instrument (or group placeholder) record for a palette drop --
// row/column are the caller's to fill in, since the top-level drop and the
// container-scoped one below resolve them against different frames. Shared
// so the two don't duplicate the group-vs-instrument-vs-unknown logic.
function instrumentForDrop(data) {
  if (data.startsWith("group:")) {
    const def = state.groupsById[data.slice(6)];
    if (!def) return null;
    const sp = def.defaultSpan || { rows: 40, columns: 50 };
    return { type: "group", id: def.id, span: { rows: sp.rows, columns: sp.columns } };
  }
  if (state.schema.instruments[data]) {
    const meta = state.schema.instruments[data];
    const options = {};
    // A button needs a backing touchscreen-button FIX key; assign an unused one
    // so the builder never has to hand-pick it (dbkey is a required option).
    if (data === "button") options.dbkey = allocateTsbtn();
    const inst = { type: data, span: { rows: 20, columns: 20 }, options };
    // Container instruments (e.g. tab_section's "tabs") start with one default
    // tab rather than zero -- never dropped in an unrenderable state, matching
    // pyEfis's own empty-tabs fallback (AER-173 design doc §4a).
    if (meta.containers && meta.containers.length) {
      for (const slot of meta.containers) ensureContainerSlot(inst, slot);
      inst.activeTab = 0;
    }
    return inst;
  }
  return null;
}

// Brief red outline on a container's drop zone -- feedback for a rejected
// drop (a tab_section dropped into a tab, sec 3/sec 7 Q1) without an
// intrusive alert().
function flashReject(el) {
  el.classList.add("reject-flash");
  setTimeout(() => el.classList.remove("reject-flash"), 400);
}

canvas.addEventListener("drop", (e) => {
  e.preventDefault(); canvas.classList.remove("dragover");
  const data = e.dataTransfer.getData("text/plain");
  const cr = canvas.getBoundingClientRect();
  const mx = e.clientX - cr.left, my = e.clientY - cr.top;

  // Container-scoped drop-target (AER-345 sec 4b): when the SELECTED
  // instrument is a container and the drop point falls inside its box,
  // insert into that container's active tab instead of the top-level screen
  // -- not a new global editor mode, scoped to whatever's already selected.
  const sel = state.selected >= 0 ? state.instruments[state.selected] : null;
  const selMeta = sel ? state.schema.instruments[sel.type] : null;
  if (sel && selMeta?.containers?.length) {
    const box = rect(sel);   // sel is always top-level -> root space
    if (mx >= box.x && mx < box.x + box.w && my >= box.y && my < box.y + box.h) {
      if (data === "tab_section") {
        const contentEl = document.querySelector(`.inst[data-i="${state.selected}"] .tab-twin-content`);
        if (contentEl) flashReject(contentEl);
        return;
      }
      const dropped = instrumentForDrop(data);
      if (!dropped) return;
      const slot = selMeta.containers[0];
      const tabs = ensureContainerSlot(sel, slot);
      const activeIdx = defaultActiveTab(sel, tabs);
      sel.activeTab = activeIdx;
      const tab = tabs[activeIdx];
      const tabLayout = tab.layout || { rows: 110, columns: 200 };
      // Tab-local coordinates (sec 4b): divide by the TAB's own layout, not
      // the screen's -- the same nested-space math buildContainerTwin uses.
      // cbox is the content area within box, net of the tab bar on whichever
      // edge tab_position names (AER-665) -- top-only was the sec-4b original.
      const cbox = tabContentGeom(box, tabPosition(sel), tabBarThickness(sel));
      const gw = cbox.w / (tabLayout.columns || 1);
      const gh = cbox.h / (tabLayout.rows || 1);
      dropped.column = clamp(snapTo((mx - box.x - cbox.x) / gw), 0, tabLayout.columns - 1);
      dropped.row = clamp(snapTo((my - box.y - cbox.y) / gh), 0, tabLayout.rows - 1);
      tab.instruments = tab.instruments || [];
      tab.instruments.push(dropped);
      renderCanvas(); renderProps();
      return;
    }
  }

  // Top-level drop: the existing screen-scoped behaviour.
  const { gw, gh } = cell();
  const dropped = instrumentForDrop(data);
  if (!dropped) return;
  dropped.column = clamp(snapTo(mx / gw), 0, state.layout.columns - 1);
  dropped.row = clamp(snapTo(my / gh), 0, state.layout.rows - 1);
  state.instruments.push(dropped);
  state.selected = state.instruments.length - 1;
  state.nestedSel = null;
  renderCanvas(); renderProps();
});

// --- move / resize ----------------------------------------------------------
function startMove(e, i, el) {
  if (e.target.classList.contains("handle")) return;
  e.preventDefault();
  select(i);
  const { gw, gh } = cell();
  const inst = state.instruments[i];
  const sx = e.clientX, sy = e.clientY, srow = inst.row, scol = inst.column;
  const move = (ev) => {
    const col = clamp(snapTo(scol + (ev.clientX - sx) / gw), 0, state.layout.columns - inst.span.columns);
    const row = clamp(snapTo(srow + (ev.clientY - sy) / gh), 0, state.layout.rows - inst.span.rows);
    const a = snapAlign(inst, col, row, gw, gh);   // snap to objects / guides when close
    inst.column = clamp(a.col, 0, state.layout.columns - inst.span.columns);
    inst.row = clamp(a.row, 0, state.layout.rows - inst.span.rows);
    positionEl(el, inst); syncPosFields(inst);
    drawAlign(a.vg, a.hg);
  };
  const up = () => { clearAlign(); syncCode(); document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
}

function startResize(e, i, el) {
  e.preventDefault(); e.stopPropagation();
  select(i);
  const { gw, gh } = cell();
  const inst = state.instruments[i];
  const sx = e.clientX, sy = e.clientY, sc = inst.span.columns, sr = inst.span.rows;
  const move = (ev) => {
    inst.span.columns = clamp(snapTo(sc + (ev.clientX - sx) / gw), 1, state.layout.columns);
    inst.span.rows = clamp(snapTo(sr + (ev.clientY - sy) / gh), 1, state.layout.rows);
    positionEl(el, inst); syncPosFields(inst);
  };
  const up = () => { syncCode(); document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
}

// Move/resize for an instrument nested in a tab_section's active tab --
// mirrors startMove/startResize but bounds against the TAB's own layout and
// the container's nested pixel space (captured at the render pass that drew
// it) instead of the screen's, so a dropped instrument can be nudged into
// place without leaving the properties panel's numeric fields as the only
// option (AER-345 sec 4b/4f).
function startMoveNested(e, ci, slot, ti, ii, el, space, tabLayout) {
  if (e.target.classList.contains("handle")) return;
  e.preventDefault(); e.stopPropagation();
  selectNested(ci, slot, ti, ii);
  const inst = state.instruments[ci][slot][ti].instruments[ii];
  const { gw, gh } = space;
  const sx = e.clientX, sy = e.clientY, srow = inst.row, scol = inst.column;
  const move = (ev) => {
    inst.column = clamp(snapTo(scol + (ev.clientX - sx) / gw), 0, tabLayout.columns - inst.span.columns);
    inst.row = clamp(snapTo(srow + (ev.clientY - sy) / gh), 0, tabLayout.rows - inst.span.rows);
    positionEl(el, inst, space); syncPosFields(inst);
  };
  const up = () => { syncCode(); document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
}

function startResizeNested(e, ci, slot, ti, ii, el, space, tabLayout) {
  e.preventDefault(); e.stopPropagation();
  selectNested(ci, slot, ti, ii);
  const inst = state.instruments[ci][slot][ti].instruments[ii];
  const { gw, gh } = space;
  const sx = e.clientX, sy = e.clientY, sc = inst.span.columns, sr = inst.span.rows;
  const move = (ev) => {
    inst.span.columns = clamp(snapTo(sc + (ev.clientX - sx) / gw), 1, tabLayout.columns);
    inst.span.rows = clamp(snapTo(sr + (ev.clientY - sy) / gh), 1, tabLayout.rows);
    positionEl(el, inst, space); syncPosFields(inst);
  };
  const up = () => { syncCode(); document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
}

function select(i) {
  state.selected = i;
  state.nestedSel = null;
  document.querySelectorAll(".inst").forEach((el) => el.classList.toggle("sel", Number(el.dataset.i) === i));
  renderProps();
}

// Select an instrument nested inside a tab_section's active tab (AER-345):
// the container itself stays "selected" (its box/strip keep showing, and a
// click on its own background still falls through to startMove/select as
// before) while the child's OWN properties show in the inspector. Toggles
// classes on the existing DOM rather than a full renderCanvas(), matching
// select()'s pattern.
function selectNested(ci, slot, ti, ii) {
  state.selected = ci;
  state.nestedSel = { ci, slot, ti, ii };
  document.querySelectorAll(".inst").forEach((el) => {
    const isContainer = el.dataset.child === undefined && Number(el.dataset.i) === ci;
    const isTarget = el.dataset.child !== undefined
      && Number(el.dataset.container) === ci && el.dataset.slot === slot
      && Number(el.dataset.tab) === ti && Number(el.dataset.child) === ii;
    el.classList.toggle("sel", isContainer || isTarget);   // both levels highlight
  });
  renderProps();
}

// --- properties panel -------------------------------------------------------
function renderProps() {
  const p = $("props");
  p.innerHTML = "";

  // Layers (z-order). pyEfis has no z-index: paint order IS list order, so
  // these reorder the instruments array, which serialises straight to YAML.
  if (state.instruments.length) {
    const lh = document.createElement("h3"); lh.textContent = "Layers (top = front)"; p.appendChild(lh);
    const tools = document.createElement("div"); tools.className = "row layer-tools";
    for (const [lbl, where, tip] of [["⤒", "front", "Bring to front"], ["↑", "up", "Forward"], ["↓", "down", "Backward"], ["⤓", "back", "Send to back"]]) {
      const b = document.createElement("button");
      b.textContent = lbl; b.title = tip; b.disabled = state.selected < 0;
      b.addEventListener("click", () => moveSelected(where));
      tools.appendChild(b);
    }
    p.appendChild(tools);
    const list = document.createElement("ul"); list.className = "layers";
    for (let i = state.instruments.length - 1; i >= 0; i--) {   // top = last = front
      const inst = state.instruments[i];
      const li = document.createElement("li");
      li.className = "layer" + (i === state.selected ? " sel" : "");
      li.textContent = state.schema.instruments[inst.type]?.label
        || (inst.type === "group" ? (state.groupsById[inst.id]?.label || "Group") : inst.type);
      li.addEventListener("click", () => select(i));
      list.appendChild(li);
    }
    p.appendChild(list);
  }

  // A nested selection (AER-345) takes over the panel until it's cleared or
  // stale (its tab/container got deleted out from under it -- tab CRUD
  // already clears nestedSel on mutation, this is the defensive fallback).
  if (state.nestedSel) {
    const ns = state.nestedSel;
    const container = state.instruments[ns.ci];
    const tabs = container ? container[ns.slot] : null;
    const tab = tabs ? tabs[ns.ti] : null;
    const nestedInst = tab ? tab.instruments[ns.ii] : null;
    if (container && tab && nestedInst) {
      p.appendChild(Object.assign(document.createElement("hr"), { className: "sep" }));
      renderNestedProps(p, container, ns, tab, nestedInst);
      return;
    }
    state.nestedSel = null;
  }

  // Per-selection properties
  if (state.selected < 0 || !state.instruments[state.selected]) {
    const hint = document.createElement("p"); hint.className = "empty";
    hint.textContent = state.instruments.length
      ? "Select an instrument to edit its properties."
      : "Drag an instrument from the left onto the canvas.";
    p.appendChild(hint);
    return;
  }
  const inst = state.instruments[state.selected];
  p.appendChild(Object.assign(document.createElement("hr"), { className: "sep" }));

  if (inst.type === "group") {
    const def = state.groupsById[inst.id];
    const gt = document.createElement("h3"); gt.textContent = (def ? def.label : "Group") + " — group"; p.appendChild(gt);
    p.appendChild(numGrid([
      ["row", inst.row, (v) => inst.row = v],
      ["column", inst.column, (v) => inst.column = v],
      ["span rows", inst.span.rows, (v) => inst.span.rows = v],
      ["span cols", inst.span.columns, (v) => inst.span.columns = v],
    ]));
    const ung = document.createElement("button");
    ung.textContent = "Ungroup"; ung.style.marginTop = "8px";
    ung.addEventListener("click", ungroup);
    p.appendChild(ung);
    return;
  }

  const meta = state.schema.instruments[inst.type];
  const title = document.createElement("h3"); title.textContent = meta.label + " — properties"; p.appendChild(title);

  const d = dpi();
  if (d) {
    const pw = (inst.span.columns / state.layout.columns) * state.screen.width / d * 25.4;
    const ph = (inst.span.rows / state.layout.rows) * state.screen.height / d * 25.4;
    const note = document.createElement("p");
    note.className = "muted"; note.style.margin = "0 0 8px";
    note.textContent = `≈ ${pw.toFixed(0)} × ${ph.toFixed(0)} mm on the ${state.screen.inches}″ screen`;
    p.appendChild(note);
  }

  p.appendChild(numGrid([
    ["row", inst.row, (v) => inst.row = v],
    ["column", inst.column, (v) => inst.column = v],
    ["span rows", inst.span.rows, (v) => inst.span.rows = v],
    ["span cols", inst.span.columns, (v) => inst.span.columns = v],
  ]));

  // Instruments loaded from a template/saved config can omit the options block;
  // make it a real object so the fields render AND edits have somewhere to land.
  inst.options = inst.options || {};
  const opts = { ...state.schema.common_options, ...meta.options };
  if (Object.keys(opts).length) {
    const h = document.createElement("h3"); h.textContent = "Options"; p.appendChild(h);
    for (const [name, spec] of Object.entries(opts)) p.appendChild(optionField(inst, name, spec));
  }
  const offer = migrationOffer(inst);
  if (offer) p.appendChild(offer);

  // Container instruments (tab_section's "tabs", per the schema's `containers`
  // metadata -- AER-173 §4g): tab-list CRUD. Dropping/selecting/editing an
  // instrument INTO a tab is the on-canvas drop-target + renderNestedProps()
  // below (AER-345 Phase B).
  for (const slot of (meta.containers || [])) p.appendChild(buildContainerEditor(inst, slot));

  // Soft-controls: a Button's behaviour is a list of conditions, each firing a
  // list of actions. Its own dedicated editor (below the plain options).
  if (inst.type === "button") p.appendChild(renderConditions(inst));
}

// Properties panel for an instrument nested inside a tab_section's active tab
// (AER-345). Same generic building blocks (numGrid, optionField) top-level
// properties use, just bound to the nested record and reached through a
// breadcrumb back to the container -- no separate nested-container editor
// needed since a tab_section can't nest another one (sec 3/sec 7 Q1).
function renderNestedProps(p, container, ns, tab, inst) {
  const back = document.createElement("button");
  back.className = "screen-add";
  back.textContent = "‹ Back to " + (state.schema.instruments[container.type]?.label || "container");
  back.addEventListener("click", () => select(ns.ci));
  p.appendChild(back);

  const meta = state.schema.instruments[inst.type] || {};
  const title = document.createElement("h3");
  title.textContent = (meta.label || inst.type) + ` — in "${tab.label || "tab"}"`;
  p.appendChild(title);

  // Reposition via a full renderCanvas() rather than repositionSelected()'s
  // single-element fast path: repositionSelected() only knows how to find
  // state.instruments[state.selected], which is the CONTAINER here, not this
  // nested child.
  p.appendChild(numGrid([
    ["row", inst.row, (v) => inst.row = v],
    ["column", inst.column, (v) => inst.column = v],
    ["span rows", inst.span.rows, (v) => inst.span.rows = v],
    ["span cols", inst.span.columns, (v) => inst.span.columns = v],
  ], () => renderCanvas()));

  inst.options = inst.options || {};
  const opts = { ...state.schema.common_options, ...meta.options };
  if (Object.keys(opts).length) {
    const h = document.createElement("h3"); h.textContent = "Options"; p.appendChild(h);
    for (const [name, spec] of Object.entries(opts)) p.appendChild(optionField(inst, name, spec));
  }
  const offer = migrationOffer(inst);
  if (offer) p.appendChild(offer);

  const rm = document.createElement("button");
  rm.textContent = "Remove from tab"; rm.style.marginTop = "8px";
  rm.addEventListener("click", () => {
    const idx = tab.instruments.indexOf(inst);
    if (idx >= 0) tab.instruments.splice(idx, 1);
    select(ns.ci);
    renderCanvas();
  });
  p.appendChild(rm);
}

// --- container slots (e.g. tab_section's "tabs") ----------------------------
// A container slot (schema `containers[]`, AER-173 §4g) holds a subtree, not a
// scalar option: an ordered list of {label, layout, instruments} tab pages,
// the same shape pyEfis nests a Screen from (docs/screenbuilder.md#tab_section
// on the pyEfis side). This section is the tab-list CRUD; the on-canvas drop
// target + nested twin (buildContainerTwin, below) and dragging an EXISTING
// top-level instrument into a tab are AER-345 (Phase B) / AER-173 §6 Phase C.

// A dropped/loaded container instrument should never have zero tabs -- mirrors
// pyEfis's own empty-tabs fallback in tab_section/__init__.py.
function ensureContainerSlot(inst, slot) {
  if (!Array.isArray(inst[slot.name]) || !inst[slot.name].length) {
    inst[slot.name] = [{ label: "Tab 1", layout: { rows: 110, columns: 200 }, instruments: [] }];
  }
  return inst[slot.name];
}

// The tab shown before the user has picked one this session: the configured
// `default_tab` option (AER-173 §4d -- a plain scalar Prop, resolved once on
// first render, distinct from `activeTab`'s editor-session-only bookkeeping).
function defaultActiveTab(inst, tabs) {
  const seed = inst.activeTab ?? (Number(inst.options?.default_tab) || 0);
  return clamp(seed, 0, tabs.length - 1);
}

function uniqueTabLabel(tabs, base, exclude) {
  let name = String(base || "Tab").trim() || "Tab", k = 2;
  while (tabs.some((t, i) => i !== exclude && t.label === name)) name = `${base} ${k++}`;
  return name;
}

function buildContainerEditor(inst, slot) {
  const wrap = document.createElement("div");
  const tabs = ensureContainerSlot(inst, slot);
  inst.activeTab = defaultActiveTab(inst, tabs);

  const h = document.createElement("h3"); h.textContent = slot.label || slot.name; wrap.appendChild(h);
  if (slot.help) {
    const hint = document.createElement("p"); hint.className = "muted"; hint.style.margin = "0 0 8px";
    hint.textContent = slot.help; wrap.appendChild(hint);
  }

  // Any tab CRUD below can shift/replace/drop tab indices -- a nested
  // selection scoped to the old arrangement would be stale or wrong, so
  // every mutation clears it rather than trying to re-target it.
  const refresh = () => { state.nestedSel = null; renderCanvas(); syncCode(); renderProps(); };

  const list = document.createElement("ul"); list.className = "layers";
  tabs.forEach((tab, i) => {
    const li = document.createElement("li");
    li.className = "layer" + (i === inst.activeTab ? " sel" : "");
    li.style.display = "flex"; li.style.alignItems = "center"; li.style.gap = "6px";

    const lbl = document.createElement("span");
    lbl.textContent = tab.label || `Tab ${i + 1}`;
    lbl.style.flex = "1"; lbl.style.cursor = "pointer";
    lbl.title = "Select this tab";
    lbl.addEventListener("click", () => { inst.activeTab = i; refresh(); });
    li.appendChild(lbl);

    const mk = (label, title, fn, disabled) => {
      const b = document.createElement("button");
      b.textContent = label; b.title = title; b.disabled = !!disabled;
      b.style.padding = "1px 6px"; b.style.fontSize = "12px";
      b.addEventListener("click", (e) => { e.stopPropagation(); fn(); });
      return b;
    };
    li.appendChild(mk("✎", "Rename tab", () => {
      const raw = prompt("Rename tab:", tab.label || `Tab ${i + 1}`);
      if (raw == null) return;
      tab.label = uniqueTabLabel(tabs, raw.trim() || tab.label, i);
      refresh();
    }));
    li.appendChild(mk("↑", "Move earlier", () => {
      if (i === 0) return;
      [tabs[i - 1], tabs[i]] = [tabs[i], tabs[i - 1]];
      if (inst.activeTab === i) inst.activeTab = i - 1;
      else if (inst.activeTab === i - 1) inst.activeTab = i;
      refresh();
    }, i === 0));
    li.appendChild(mk("↓", "Move later", () => {
      if (i === tabs.length - 1) return;
      [tabs[i + 1], tabs[i]] = [tabs[i], tabs[i + 1]];
      if (inst.activeTab === i) inst.activeTab = i + 1;
      else if (inst.activeTab === i + 1) inst.activeTab = i;
      refresh();
    }, i === tabs.length - 1));
    li.appendChild(mk("✕", "Delete tab", () => {
      if (tabs.length <= 1) return;   // a container must always keep >=1 tab
      if (!confirm(`Delete tab '${tab.label || `Tab ${i + 1}`}'?`)) return;
      tabs.splice(i, 1);
      if (inst.activeTab >= tabs.length) inst.activeTab = tabs.length - 1;
      refresh();
    }, tabs.length <= 1));

    list.appendChild(li);
  });
  wrap.appendChild(list);

  const add = document.createElement("button");
  add.className = "screen-add"; add.textContent = "+ Add tab";
  add.addEventListener("click", () => {
    tabs.push({ label: uniqueTabLabel(tabs, `Tab ${tabs.length + 1}`), layout: { rows: 110, columns: 200 }, instruments: [] });
    inst.activeTab = tabs.length - 1;
    refresh();
  });
  wrap.appendChild(add);

  return wrap;
}

// Fixed px, not proportional to the container's box: the real widget's
// QTabBar.sizeHint() comes from font metrics, not from the container's own
// size (tab_section/__init__.py _layout_pages -- `bar_size =
// self.tab_bar.sizeHint().height()` for top/bottom, `.width()` for the
// rotated left/right shapes, computed once regardless of the widget's own
// size). One constant approximates sizeHint on whichever axis it reserves.
const TAB_BAR_THICKNESS = 22;

// Font size on tab_section scales the tab LABELS only (pyEfis #223): label px
// = max(TAB_MIN_LABEL_PX, round(TAB_LABEL_PX * scale)) when set, the inherited
// size when unset. The device bar is the label plus a fixed padding at every
// size (offscreen render: 8 px label -> 20 px bar, 12 -> 24, 18 -> 30, 36 -> 48),
// so the strip grows by the label's change, not proportionally.
const TAB_LABEL_PX = 11;       // .tab-twin-chip font-size
const TAB_MIN_LABEL_PX = 8;    // tab_section._MIN_TAB_LABEL_PX

// The common Font size option as a multiplier on a widget's own built-in text
// size (pyEfis helpers.font_scale), normalised from raw YAML the way
// screenbuilder_preferences.normalize_font_percent does: > 1 is a whole-number
// percent (150 -> 1.5), <= 1 already a fraction. Unset, zero, negative or
// non-numeric means 1.0 -- today's size.
function fontScale(v) {
  if (v == null || v === "") return 1;
  let n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return 1;
  if (n > 1) n = n / 100;
  return n;
}

// The tab label size in px, or null when Font size leaves it at the
// inherited .tab-twin-chip size.
function tabLabelPx(inst) {
  const scale = fontScale(inst?.options?.font_percent);
  if (scale === 1) return null;
  return Math.max(TAB_MIN_LABEL_PX, Math.round(TAB_LABEL_PX * scale));
}

// The strip's thickness on whichever axis it reserves.
function tabBarThickness(inst) {
  const px = tabLabelPx(inst);
  return px == null ? TAB_BAR_THICKNESS : TAB_BAR_THICKNESS + px - TAB_LABEL_PX;
}

// Which edge the tab bar sits on (tab_position option, AER-665; default
// "top" matches both the schema default and pyEfis's own `_TAB_BAR_SHAPE`
// fallback for an unrecognised value).
function tabPosition(inst) {
  const p = inst.options?.tab_position;
  return (p === "bottom" || p === "left" || p === "right") ? p : "top";
}

// The tab bar's own box within the container, box-local px -- mirrors
// tab_section/__init__.py _layout_pages' `bar_geom` exactly.
function tabStripGeom(box, position, t = TAB_BAR_THICKNESS) {
  if (position === "bottom") return { x: 0, y: Math.max(0, box.h - t), w: box.w, h: t };
  if (position === "left") return { x: 0, y: 0, w: t, h: box.h };
  if (position === "right") return { x: Math.max(0, box.w - t), y: 0, w: t, h: box.h };
  return { x: 0, y: 0, w: box.w, h: t };   // top
}

// The active tab's own content box, box-local px -- mirrors _layout_pages'
// `stack_geom`: whatever the strip doesn't occupy.
function tabContentGeom(box, position, t = TAB_BAR_THICKNESS) {
  if (position === "bottom") return { x: 0, y: 0, w: box.w, h: Math.max(0, box.h - t) };
  if (position === "left") return { x: t, y: 0, w: Math.max(0, box.w - t), h: box.h };
  if (position === "right") return { x: 0, y: 0, w: Math.max(0, box.w - t), h: box.h };
  return { x: 0, y: t, w: box.w, h: Math.max(0, box.h - t) };   // top
}

// The recursive nested twin (AER-345 sec 4f): the tab strip + the active
// tab's instruments, rendered inside the container's own box at the same
// fidelity buildInstrumentTwin() gives a top-level instrument, via the exact
// same per-type dispatch. `ci` is the container's own index in
// state.instruments (nested children are keyed off it for selection/drag).
function buildContainerTwin(inst, meta, ci) {
  const wrap = document.createElement("div"); wrap.className = "tab-twin";
  const slot = meta.containers[0];   // v1: exactly one container slot ("tabs")
  const tabs = ensureContainerSlot(inst, slot);
  const activeIdx = defaultActiveTab(inst, tabs);
  inst.activeTab = activeIdx;

  const position = tabPosition(inst);
  const vertical = position === "left" || position === "right";
  const box = rect(inst);   // a container is always top-level -> root space
  const thickness = tabBarThickness(inst);
  const stripGeom = tabStripGeom(box, position, thickness);
  const contentGeom = tabContentGeom(box, position, thickness);
  const labelPx = tabLabelPx(inst);

  // fg_color/bg_color (AER-665): a fixed override applied uniformly to every
  // chip, active or not -- matches the device's stylesheet rule, which has
  // no `:selected` clause (tab_section/__init__.py _apply_tab_bar_style).
  // Unset (null, the schema default) leaves the inherited .tab-twin-chip /
  // .active CSS legibility floor untouched.
  // Tokens resolve through the active panel theme, as everywhere else.
  const themed = themedInstrument(inst).options || {};
  const fg = themed.fg_color, bg = themed.bg_color;

  const strip = document.createElement("div");
  strip.className = "tab-twin-strip";
  strip.style.left = stripGeom.x + "px"; strip.style.top = stripGeom.y + "px";
  strip.style.width = stripGeom.w + "px"; strip.style.height = stripGeom.h + "px";
  strip.style.flexDirection = vertical ? "column" : "row";
  // Separator sits between the bar and the content, so it's on the side
  // facing the content box, not always "bottom" (that was the top-only
  // original).
  strip.style.borderBottom = strip.style.borderTop = strip.style.borderLeft = strip.style.borderRight = "";
  strip.style[{ top: "borderBottom", bottom: "borderTop", left: "borderRight", right: "borderLeft" }[position]] = "1px solid #30363d";
  if (bg) strip.style.background = bg;
  tabs.forEach((tab, ti) => {
    const chip = document.createElement("div");
    chip.className = "tab-twin-chip" + (ti === activeIdx ? " active" : "") + (vertical ? " vertical" : "");
    chip.textContent = tab.label || `Tab ${ti + 1}`;
    // West (left) reads bottom-to-top, East (right) top-to-bottom -- Qt's
    // rotation for RoundedWest/RoundedEast (tab_section/__init__.py
    // _TAB_BAR_SHAPE). vertical-rl alone gives the East reading; West flips it.
    if (position === "left") chip.style.transform = "rotate(180deg)";
    if (labelPx != null) chip.style.fontSize = labelPx + "px";
    if (fg) chip.style.color = fg;
    if (bg) chip.style.background = bg;
    chip.addEventListener("mousedown", (e) => {
      e.stopPropagation();   // switching tabs must not start a container move
      inst.activeTab = ti;
      state.nestedSel = null;   // the old selection was scoped to the prior tab
      renderCanvas(); renderProps();
    });
    strip.appendChild(chip);
  });
  wrap.appendChild(strip);

  const content = document.createElement("div");
  content.className = "tab-twin-content";
  content.style.left = contentGeom.x + "px"; content.style.top = contentGeom.y + "px";
  content.style.width = contentGeom.w + "px"; content.style.height = contentGeom.h + "px";
  wrap.appendChild(content);

  // Nested coordinate space (sec 4f's "big lift"): the container's own
  // content-box pixels divided by the ACTIVE TAB'S OWN layout, never the
  // screen's -- the exact trap Bill hit hand-authoring YAML (a tab narrower
  // than the screen makes screen coordinates land off its edge).
  const activeTab = tabs[activeIdx];
  const tabLayout = activeTab.layout || { rows: 110, columns: 200 };
  const space = {
    gw: contentGeom.w / (tabLayout.columns || 1),
    gh: contentGeom.h / (tabLayout.rows || 1),
  };

  withSpace(space, () => {
    (activeTab.instruments || []).forEach((child, ii) => {
      const childMeta = state.schema.instruments[child.type] || {};
      const childEl = document.createElement("div");
      childEl.className = "inst" + (childMeta.offscreen_renderable ? "" : " placeholder") + (childMeta.keep_aspect ? " lock" : "");
      childEl.dataset.container = ci; childEl.dataset.slot = slot.name;
      childEl.dataset.tab = activeIdx; childEl.dataset.child = ii;
      const ns = state.nestedSel;
      if (ns && ns.ci === ci && ns.slot === slot.name && ns.ti === activeIdx && ns.ii === ii) childEl.classList.add("sel");
      positionEl(childEl, child);
      buildInstrumentTwin(childEl, child, childMeta, ci, 1);
      const handle = document.createElement("div"); handle.className = "handle";
      childEl.appendChild(handle);
      childEl.addEventListener("mousedown", (e) => startMoveNested(e, ci, slot.name, activeIdx, ii, childEl, space, tabLayout));
      handle.addEventListener("mousedown", (e) => startResizeNested(e, ci, slot.name, activeIdx, ii, childEl, space, tabLayout));
      content.appendChild(childEl);
    });
  });

  return wrap;
}

// Reorder the selected instrument in the array (= change paint order).
function moveSelected(where) {
  const i = state.selected;
  if (i < 0) return;
  const arr = state.instruments;
  const item = arr.splice(i, 1)[0];
  let j;
  if (where === "front") j = arr.length;          // last = painted on top
  else if (where === "back") j = 0;
  else if (where === "up") j = Math.min(arr.length, i + 1);
  else j = Math.max(0, i - 1);
  arr.splice(j, 0, item);
  state.selected = j;
  renderCanvas(); renderProps();
}

// Ungroup: replace the selected group with its children as independent
// top-level instruments (child local positions -> absolute grid).
function ungroup() {
  const g = state.instruments[state.selected];
  if (!g || g.type !== "group") return;
  const def = state.groupsById[g.id];
  if (!def) return;
  const children = def.instruments.map((ch) => ({
    type: ch.type,
    row: g.row + (ch.row / def.grid.rows) * g.span.rows,
    column: g.column + (ch.column / def.grid.columns) * g.span.columns,
    span: {
      rows: (ch.span.rows / def.grid.rows) * g.span.rows,
      columns: (ch.span.columns / def.grid.columns) * g.span.columns,
    },
    options: { ...(ch.options || {}) },
  }));
  state.instruments.splice(state.selected, 1, ...children);
  state.selected = -1;
  renderCanvas(); renderProps();
}

function numGrid(rows, reposition) {
  reposition = reposition || repositionSelected;
  const wrap = document.createElement("div"); wrap.className = "grid2";
  for (const [label, value, set] of rows) {
    const f = document.createElement("div"); f.className = "field";
    const l = document.createElement("label"); l.textContent = label;
    const inp = document.createElement("input"); inp.type = "number"; inp.value = value;
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value); if (!isNaN(v)) { set(v); reposition(); syncCode(); }
    });
    f.append(l, inp); wrap.appendChild(f);
  }
  return wrap;
}

// Shared <datalist> behind every fixkey input: a type-ahead over the FIX key
// catalog (dumped from the fix-gateway database). Type to filter by key; the
// description + units show alongside in the dropdown.
function buildFixKeyDatalist() {
  let dl = document.getElementById("fixkeys");
  if (!dl) { dl = document.createElement("datalist"); dl.id = "fixkeys"; document.body.appendChild(dl); }
  dl.innerHTML = "";
  for (const k of (state.fixKeys || [])) {
    const op = document.createElement("option");
    op.value = k.key;
    const u = k.units ? ` (${k.units})` : "";
    if (k.description || u) op.label = (k.description || "") + u;
    dl.appendChild(op);
  }
}

// --- Colour tokens (style contract, CAP-121; pyEfis S1, #368) ----------------
// A colour option's value may be a semantic token name or a literal:
// `fg_color: ink.primary` and `fg_color: "#ffffff"` are both legal on the
// device. This is the twin of pyefis/screens/color_tokens.py: the vocabulary,
// which token each colour prop reads (Prop.token in the REGISTRY), and
// apply_theme_colors(), the order the device resolves them in. Pinned against
// the real module by test/color_tokens_twin.test.mjs (fixture from
// tools/color_tokens_oracle.py); update all three together.
//
// [name, built-in value, description]. A null value: no shipped prop reads the
// token yet, so on the device an option naming it falls back to the widget's
// own default.
const COLOR_TOKENS = [
  ["surface.base", "#000000", "panel ground"],
  ["surface.raised", "#101418", "readout boxes, plates, buttons"],
  ["ink.primary", "#ffffff", "primary data values"],
  ["ink.secondary", "#ffffff", "labels, units, prefixes"],
  ["ink.muted", "#aaaaaa", "inactive, section headers, disabled"],
  ["line.border", "#ffffff", "borders and frames"],
  ["line.major", null, "cardinal / 30 degree ticks"],
  ["line.minor", null, "10 degree ticks"],
  ["line.fine", null, "5 degree ticks"],
  ["accent", "#00ffff", "interactive / selected / focused"],
  ["state.valid", "#00ff00", "received, complete, in-range"],
  ["state.caution", "#ffaa00", "attention"],
  ["state.warning", null, "exceeded, failed"],
  ["nav.course", "#ff00ff", "active course and track"],
  ["nav.reference", "#00ffff", "bugs, selected values"],
  ["nav.ownship", "#ffff00", "own-ship symbology"],
  ["map.road", "#c0c0c0", "roads and highways"],
  ["map.water", "#4a6d8c", "water bodies and rivers"],
  ["map.terrain", null, "terrain base"],
];
const COLOR_TOKEN_INDEX = Object.fromEntries(COLOR_TOKENS.map((t) => [t[0], t]));
// Token groups a theme may not redefine: a theme changes how the panel feels,
// never what a colour means.
const COLOR_TOKEN_IMMUTABLE = ["nav", "state"];
// {type: {colour prop: token}}; "" = a declared colour prop with no token.
const COLOR_PROP_TOKENS = {
  airspeed_tape: { ias_bug_color: "" },
  altimeter_tape: { alt_bug_color: "", alt_bug_alert_color: "", altsel_capture_color: "", vs_bug_color: "" },
  altimeter_trend_tape: { bg_color: "surface.base" },
  atitude_indicator: { symbol_color: "nav.ownship", horizon_heading_color: "ink.primary" },
  ap_annunciator: { active_color: "", armed_color: "", warning_color: "", background_color: "" },
  autopilot_panel: { active_color: "state.valid", armed_color: "ink.primary", caution_color: "state.caution",
    key_color: "surface.raised", level_color: "", text_color: "ink.primary", muted_color: "ink.muted",
    line_color: "line.border", target_color: "nav.reference", bg_color: "surface.base" },
  button: { bg_color: "surface.raised", fg_color: "accent" },
  checklist: { text_color: "ink.primary", response_color: "accent", done_color: "state.valid",
    current_color: "state.caution", section_color: "ink.muted" },
  flight_plan: { active_color: "", future_color: "", past_color: "" },
  heading_display: { fg_color: "ink.primary", bg_color: "surface.base" },
  horizontal_situation_indicator: { fg_color: "ink.primary", bg_color: "surface.base",
    needle_color: "nav.ownship", course_color: "nav.course", vloc_color: "state.valid",
    heading_bug_color: "nav.reference", track_color: "nav.course", turn_rate_color: "nav.course",
    bearing_color: "nav.reference" },
  moving_map: { symbol_color: "nav.ownship", range_ring_color: "", road_color: "map.road",
    road_casing_color: "", river_color: "map.water" },
  nav_status: { active_color: "", text_color: "" },
  tab_section: { fg_color: "", bg_color: "" },
  value_text: { prefix_color: "ink.secondary", value_color: "ink.primary",
    border_color: "line.border", bg_color: "surface.base" },
  vsi_pfd: { vs_bug_color: "" },
  virtual_vfr: { symbol_color: "nav.ownship", horizon_heading_color: "ink.primary",
    svs_road_color: "", svs_road_casing_color: "" },
};

// Panel themes the configurator can offer. A theme is the preferences the
// device would hold (style: + styles: colors:); null = pyEfis's shipped
// preferences, which define no colors: block, so every token keeps its built-in
// value. pyEfis ships no other theme yet.
const PANEL_THEMES = [
  { id: "builtin", label: "pyEfis built-in", preferences: null },
];
function activeThemePreferences() {
  const t = PANEL_THEMES.find((x) => x.id === state.theme) || PANEL_THEMES[0];
  return t.preferences;
}

function isColorToken(v) { return typeof v === "string" && Object.hasOwn(COLOR_TOKEN_INDEX, v); }
function isImmutableToken(t) { return COLOR_TOKEN_IMMUTABLE.includes(t.split(".")[0]); }
function colorTokenDefault(t) { return COLOR_TOKEN_INDEX[t][1]; }

// theme_colors(): every enabled style's styles: colors: <style> block, merged
// in style: order, later styles winning; unknown and immutable tokens dropped.
function themeColors(prefs) {
  const colors = {};
  const isObj = (x) => x !== null && typeof x === "object" && !Array.isArray(x);
  if (!isObj(prefs)) return colors;
  const styles = prefs.styles || {};
  const blocks = isObj(styles) ? styles.colors : null;
  if (!isObj(blocks)) return colors;
  for (const [style, enabled] of Object.entries(prefs.style || {})) {
    if (!enabled) continue;
    const block = blocks[style];
    if (!isObj(block)) continue;
    for (const [token, value] of Object.entries(block)) {
      if (!isColorToken(token) || isImmutableToken(token)) continue;
      if (value !== null && value !== undefined) colors[token] = value;
    }
  }
  return colors;
}

// resolve(): a token becomes the theme's value, else its built-in value; any
// other value (a literal, a Qt colour name) is returned unchanged.
function resolveColorToken(value, colors) {
  if (!isColorToken(value)) return value;
  if (Object.hasOwn(colors, value) && !isImmutableToken(value)) return colors[value];
  return colorTokenDefault(value);
}

// apply_theme_colors(): level 4 (the theme fills a mapped colour prop nothing
// else set), then token resolution LAST on whatever value won. Returns the
// options the device would build the widget with; never mutates `options`.
function applyThemeColors(type, options, prefs) {
  const colorProps = COLOR_PROP_TOKENS[type] || {};
  const colors = themeColors(prefs);
  let out = { ...(options || {}) };
  const filled = {};
  for (const [name, token] of Object.entries(colorProps))
    if (token && !Object.hasOwn(out, name) && Object.hasOwn(colors, token)) filled[name] = token;
  out = { ...filled, ...out };
  for (const name of Object.keys(out)) {
    const value = out[name];
    const isColorOpt = Object.hasOwn(colorProps, name) || name.endsWith("color") || name.endsWith("colour");
    if (!isColorToken(value) || !isColorOpt) continue;
    const resolved = resolveColorToken(value, colors);
    if (resolved === null || resolved === undefined) delete out[name];
    else out[name] = resolved;
  }
  return out;
}

// The instrument as the twin should draw it: colour tokens resolved against
// the active panel theme. The SAME object when nothing changes, so a panel
// with no tokens renders exactly as it did before tokens existed.
// The instrument as the device will receive it: its aircraft references
// resolved by the same function as GET /device/config. A tank reference
// becomes the tank's slot key and label; a reference to a removed tank becomes
// `unbound: true` under its last label.
function refResolved(inst) {
  const R = state.aircraftRefs;
  if (!R || !inst.options) return inst;
  const pv = state.migrationPreview;
  const opts = pv && pv.inst === inst ? migratedOptions(inst.options, pv.id) : inst.options;
  const r = R.mod.resolveOptions(inst.type, opts, R.items, R.retired);
  return r.options === inst.options ? inst : { ...inst, options: r.options };
}

// A stored instrument's tank reference as the device will receive it: null
// when it holds none, else {id, item, orphan, label}. `orphan` = the active
// profile has no tank with that id (only known once the refs have loaded);
// `label` = the tank's label, else the last one it had.
function tankBinding(inst) {
  const id = inst && inst.options ? inst.options.tank : undefined;
  if (id === undefined || id === null || id === "") return null;
  const R = state.aircraftRefs;
  const spec = R && R.mod.AIRCRAFT_REFS.tank;
  if (!R || !spec || !spec.types.includes(inst.type)) return { id: String(id), item: null, orphan: false, label: null };
  const item = (R.items[spec.source] || []).find((i) => i.id === String(id)) || null;
  return { id: String(id), item, orphan: !item,
           label: item ? item.label : (R.retired[String(id)] || inst.options.name || null) };
}

// Binding a gauge to a tank: the reference replaces the plain dbkey and
// name, which the resolver writes from the tank (brief section 7).
function migratedOptions(options, id) {
  const { dbkey, name, unbound, ...rest } = options || {};
  return { ...rest, tank: id };
}

// Whether the twin may draw a tank's bands from the profile: only once the
// device receives aircraft.ini (Phase C, docs/canfix_configurator.md
